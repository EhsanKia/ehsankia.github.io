<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#120a2a">
<meta name="description" content="Swipe Boggle — a fast, friendly word-search party game you can play with up to 8 friends, peer-to-peer.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Swipe Boggle</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23241350'/%3E%3Crect x='8' y='8' width='22' height='22' rx='6' fill='%23f6efdd'/%3E%3Crect x='34' y='8' width='22' height='22' rx='6' fill='%23ffd23f'/%3E%3Crect x='8' y='34' width='22' height='22' rx='6' fill='%23ffd23f'/%3E%3Crect x='34' y='34' width='22' height='22' rx='6' fill='%23f6efdd'/%3E%3C/svg%3E">
<style>
/* ============================ TOKENS ============================ */
:root{
  --bg0:#0b0620; --bg1:#1a0f3e; --bg2:#2a1560;
  --ink:#fdfbff; --ink-dim:#b3a6d6; --ink-faint:#7d6fa6;
  --gold:#ffd23f; --gold-deep:#f0a500;
  --grape:#8b5cf6; --grape-lo:#6d38f0;
  --mint:#3ddc97; --rose:#ff5773; --tang:#ff9f43; --sky:#3bc9ff;
  --tile:#f7f1e1; --tile-lo:#ded4bd; --tile-ink:#241540;
  --glass:rgba(255,255,255,.07);
  --glass-line:rgba(255,255,255,.14);
  --shadow:0 18px 40px -18px rgba(0,0,0,.85);
  --r-s:10px; --r-m:16px; --r-l:24px; --r-xl:32px;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --ease-out:cubic-bezier(.22,1,.36,1);
  --ease-back:cubic-bezier(.34,1.56,.64,1);
  --font:"SF Pro Rounded",ui-rounded,"Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
}

/* ============================ RESET ============================ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  font-family:var(--font);
  font-weight:800;
  color:var(--ink);
  background:var(--bg0);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  overscroll-behavior:none;
  -webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none;
  touch-action:manipulation;
}
button,input,select{font:inherit;color:inherit;border:0;background:none;outline:none}
button{cursor:pointer;-webkit-appearance:none;appearance:none}
input{-webkit-user-select:text;user-select:text}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:99px}
::selection{background:var(--gold);color:#20143f}

/* ============================ BACKDROP ============================ */
#bg{position:fixed;inset:0;z-index:0;background:
    radial-gradient(120% 90% at 50% -10%,var(--bg2) 0%,var(--bg1) 45%,var(--bg0) 100%);
  overflow:hidden}
#bg i{position:absolute;display:block;border-radius:50%;filter:blur(60px);opacity:.42;
  animation:drift linear infinite;will-change:transform}
#bg i:nth-child(1){width:52vmax;height:52vmax;left:-16vmax;top:-14vmax;background:#7c3aed;animation-duration:34s}
#bg i:nth-child(2){width:44vmax;height:44vmax;right:-14vmax;top:8vmax;background:#db2777;animation-duration:41s;animation-direction:reverse}
#bg i:nth-child(3){width:40vmax;height:40vmax;left:6vmax;bottom:-18vmax;background:#0ea5e9;animation-duration:47s}
#bg i:nth-child(4){width:30vmax;height:30vmax;right:2vmax;bottom:-10vmax;background:#f59e0b;opacity:.25;animation-duration:29s;animation-direction:reverse}
@keyframes drift{
  0%{transform:translate3d(0,0,0) scale(1)}
  33%{transform:translate3d(6vmax,4vmax,0) scale(1.14)}
  66%{transform:translate3d(-5vmax,7vmax,0) scale(.92)}
  100%{transform:translate3d(0,0,0) scale(1)}
}
#bg::after{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(rgba(255,255,255,.055) 1px,transparent 1px);
  background-size:3px 3px;mix-blend-mode:overlay}
#fx{position:fixed;inset:0;z-index:60;pointer-events:none}

/* ============================ SHELL ============================ */
/* Fixed 100% tracks: an `auto` track would size to the widest screen's
   max-content and let a long row of word chips stretch the whole layout. */
#app{position:fixed;inset:0;z-index:1;display:grid;grid-template-columns:100%;grid-template-rows:100%;overflow:hidden}
.screen{
  grid-area:1/1;flex-direction:column;min-height:0;min-width:0;
  padding:calc(var(--safe-t) + 10px) 14px calc(var(--safe-b) + 10px);
}
/* Specificity has to beat helper classes like .center that set display. */
.screen:not(.on){display:none}
.screen.on{display:flex}
.screen.in{animation:scrIn .42s var(--ease-out) both}
@keyframes scrIn{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.grow{flex:1 1 auto;min-height:0}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center}
.row{display:flex;align-items:center;gap:10px}
.wrap{width:100%;max-width:520px;margin-inline:auto}
.hide{display:none!important}

/* ============================ TYPE ============================ */
.brand{text-align:center;line-height:.88;user-select:none}
.brand .word{display:flex;justify-content:center;gap:clamp(3px,1.4vw,7px)}
.brand .word span{
  display:grid;place-items:center;
  width:clamp(38px,12.5vw,62px);height:clamp(38px,12.5vw,62px);
  border-radius:clamp(9px,3vw,15px);
  font-size:clamp(21px,7vw,35px);font-weight:900;
  color:var(--tile-ink);
  background:linear-gradient(170deg,#fffdf5,var(--tile) 46%,var(--tile-lo));
  box-shadow:0 5px 0 #b9ad91,0 14px 24px -8px rgba(0,0,0,.65),inset 0 2px 0 rgba(255,255,255,.9);
  animation:brandPop .62s var(--ease-back) both,brandFloat 4.6s ease-in-out infinite;
}
.brand .word span:nth-child(even){background:linear-gradient(170deg,#ffe793,var(--gold) 46%,var(--gold-deep));box-shadow:0 5px 0 #a86f00,0 14px 24px -8px rgba(0,0,0,.65),inset 0 2px 0 rgba(255,255,255,.7)}
@keyframes brandPop{from{opacity:0;transform:translateY(-38px) rotate(-16deg) scale(.5)}to{opacity:1;transform:none}}
@keyframes brandFloat{0%,100%{translate:0 0}50%{translate:0 -6px}}
.tag{margin-top:14px;text-align:center;color:var(--ink-dim);font-size:14px;font-weight:700;letter-spacing:.02em}
h2.hd{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);font-weight:900}
.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* ============================ CONTROLS ============================ */
.btn{
  position:relative;display:flex;align-items:center;justify-content:center;gap:9px;
  width:100%;padding:16px 18px;border-radius:var(--r-m);
  font-size:17px;font-weight:900;letter-spacing:.01em;color:#fff;
  background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.05));
  box-shadow:0 4px 0 rgba(0,0,0,.34),0 12px 24px -12px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.24);
  transition:transform .11s var(--ease-out),box-shadow .11s var(--ease-out),filter .18s;
  overflow:hidden;user-select:none;
}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.34),0 6px 14px -10px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.24)}
.btn.primary{background:linear-gradient(180deg,#ffe071,var(--gold) 42%,var(--gold-deep));color:#3a1d00;box-shadow:0 5px 0 #9c6b00,0 16px 30px -14px rgba(255,180,0,.75),inset 0 1px 0 rgba(255,255,255,.75)}
.btn.primary:active{box-shadow:0 1px 0 #9c6b00,0 8px 18px -14px rgba(255,180,0,.75),inset 0 1px 0 rgba(255,255,255,.75)}
.btn.grape{background:linear-gradient(180deg,#a98bff,var(--grape) 45%,var(--grape-lo));box-shadow:0 5px 0 #4c1fae,0 16px 30px -14px rgba(139,92,246,.8),inset 0 1px 0 rgba(255,255,255,.35)}
.btn.grape:active{box-shadow:0 1px 0 #4c1fae,inset 0 1px 0 rgba(255,255,255,.35)}
.btn.ghost{background:var(--glass);box-shadow:inset 0 0 0 1.5px var(--glass-line);color:var(--ink-dim)}
.btn.ghost:active{transform:translateY(2px)}
.btn.sm{padding:11px 14px;font-size:14px;border-radius:var(--r-s);width:auto}
.btn[disabled]{opacity:.42;pointer-events:none;filter:grayscale(.5)}
.btn .shine{position:absolute;top:0;left:-120%;width:55%;height:100%;pointer-events:none;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);
  animation:shine 3.6s cubic-bezier(.5,0,.5,1) infinite}
@keyframes shine{0%,68%{left:-120%}100%{left:170%}}

.field{position:relative;display:block}
.field input{
  width:100%;padding:16px 16px;border-radius:var(--r-m);
  background:rgba(0,0,0,.3);box-shadow:inset 0 0 0 2px var(--glass-line);
  font-size:17px;font-weight:800;color:var(--ink);transition:box-shadow .2s;
}
.field input::placeholder{color:var(--ink-faint);font-weight:700}
.field input:focus{box-shadow:inset 0 0 0 2px var(--gold),0 0 0 5px rgba(255,210,63,.14)}
.field input.code{text-align:center;letter-spacing:.44em;text-indent:.44em;font-size:26px;font-weight:900;text-transform:uppercase}

.card{background:var(--glass);border-radius:var(--r-l);padding:16px;
  box-shadow:inset 0 0 0 1.5px var(--glass-line),var(--shadow);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}

/* segmented option pickers */
.opt{display:flex;flex-direction:column;gap:8px}
.opt .seg{display:flex;gap:6px;background:rgba(0,0,0,.3);padding:5px;border-radius:14px;box-shadow:inset 0 0 0 1.5px var(--glass-line)}
.opt .seg button{
  flex:1 1 0;min-width:0;padding:10px 4px;border-radius:10px;font-size:14px;font-weight:900;
  color:var(--ink-dim);transition:color .18s,transform .12s var(--ease-back);white-space:nowrap;position:relative
}
.opt .seg button small{display:block;font-size:10px;font-weight:800;opacity:.72;letter-spacing:.04em}
.opt .seg button.sel{color:#341c00;background:linear-gradient(180deg,#ffe071,var(--gold));box-shadow:0 3px 10px -2px rgba(255,200,60,.5)}
.opt .seg button:active{transform:scale(.94)}
.opt.locked .seg button{pointer-events:none}
.opt.locked .seg button:not(.sel){opacity:.4}

/* ============================ AVATARS / PLAYERS ============================ */
.av{
  position:relative;flex:0 0 auto;display:grid;place-items:center;border-radius:50%;
  font-weight:900;color:#20143f;background:var(--c,#fff);
  box-shadow:0 3px 0 rgba(0,0,0,.3),inset 0 -3px 6px rgba(0,0,0,.18),inset 0 2px 4px rgba(255,255,255,.55);
  width:var(--sz,42px);height:var(--sz,42px);font-size:calc(var(--sz,42px)*.42);
  user-select:none;
}
.av.crown::after{content:"♛";position:absolute;top:-12px;left:50%;transform:translateX(-50%) rotate(-14deg);
  font-size:calc(var(--sz,42px)*.4);color:var(--gold);text-shadow:0 2px 3px rgba(0,0,0,.6);filter:drop-shadow(0 0 6px rgba(255,210,63,.6))}
.av.me{outline:3px solid rgba(255,255,255,.85);outline-offset:2px}
.av.off{filter:grayscale(1);opacity:.45}

#plist{display:flex;flex-direction:column;gap:8px}
.pcard{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r-m);
  background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.08);
  animation:pIn .45s var(--ease-back) both}
@keyframes pIn{from{opacity:0;transform:translateX(-22px) scale(.92)}to{opacity:1;transform:none}}
.pcard.out{animation:pOut .3s var(--ease-out) forwards}
@keyframes pOut{to{opacity:0;transform:translateX(26px) scale(.9);height:0;padding-block:0;margin-top:-8px}}
.pcard .nm{flex:1 1 auto;min-width:0;font-size:16px;font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .badge{font-size:10px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;padding:4px 8px;border-radius:99px;
  background:rgba(255,255,255,.12);color:var(--ink-dim)}
.pcard .badge.host{background:linear-gradient(180deg,#ffe071,var(--gold));color:#3a1d00}
.pcard .badge.you{background:rgba(61,220,151,.2);color:var(--mint)}

/* ============================ ROOM CODE ============================ */
.codebox{display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 14px;border-radius:var(--r-l);
  background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.03));
  box-shadow:inset 0 0 0 1.5px var(--glass-line)}
.codebox .lbl{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-faint);font-weight:900}
.codebox .val{display:flex;gap:7px}
.codebox .val b{display:grid;place-items:center;width:42px;height:52px;border-radius:11px;font-size:28px;font-weight:900;
  color:var(--tile-ink);background:linear-gradient(170deg,#fffdf5,var(--tile) 50%,var(--tile-lo));
  box-shadow:0 4px 0 #b9ad91,inset 0 2px 0 rgba(255,255,255,.9);
  animation:codePop .5s var(--ease-back) both}
@keyframes codePop{from{opacity:0;transform:translateY(-16px) scale(.6) rotate(-10deg)}to{opacity:1;transform:none}}

/* ============================ GAME TOP BAR ============================ */
#gtop{display:flex;align-items:center;gap:12px;padding:2px 2px 10px}
.ring{position:relative;width:60px;height:60px;flex:0 0 auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:7;stroke-linecap:round}
.ring .trk{stroke:rgba(255,255,255,.13)}
.ring .bar{stroke:var(--mint);transition:stroke .5s}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:19px;font-weight:900}
.ring.warn .bar{stroke:var(--tang)}
.ring.crit .bar{stroke:var(--rose)}
.ring.crit{animation:pulseR .85s ease-in-out infinite}
@keyframes pulseR{0%,100%{transform:scale(1)}50%{transform:scale(1.11)}}
.ring.crit b{color:var(--rose)}

#gscore{flex:1 1 auto;min-width:0;text-align:center;line-height:1}
#gscore .n{font-size:clamp(30px,9vw,42px);font-weight:900;letter-spacing:-.02em;
  background:linear-gradient(180deg,#fff,#ffd88a);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 6px rgba(255,190,60,.35))}
#gscore .l{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-faint);font-weight:900;margin-top:3px}
#gscore.bump .n{animation:bump .42s var(--ease-back)}
@keyframes bump{0%{transform:scale(1)}38%{transform:scale(1.24)}100%{transform:scale(1)}}

#gpips{display:flex;flex-direction:column;gap:4px;align-items:flex-end;max-height:62px;flex-wrap:wrap-reverse;flex:0 0 auto}
#gpips .pip{display:flex;align-items:center;gap:5px}
#gpips .dot{width:11px;height:11px;border-radius:50%;background:var(--c);box-shadow:0 0 0 2px rgba(0,0,0,.25)}
#gpips .ct{font-size:12px;font-weight:900;color:var(--ink-dim);min-width:14px;text-align:right}
#gpips .pip.flash .dot{animation:pipFlash .6s var(--ease-out)}
@keyframes pipFlash{0%{transform:scale(1);box-shadow:0 0 0 2px rgba(0,0,0,.25)}40%{transform:scale(1.8);box-shadow:0 0 14px 3px var(--c)}100%{transform:scale(1)}}

/* ============================ BOARD ============================ */
#boardwrap{display:flex;align-items:center;justify-content:center;flex:1 1 auto;min-height:0;padding:4px 0}
#board{
  position:relative;display:grid;gap:var(--gap);
  width:var(--bs);height:var(--bs);
  touch-action:none;user-select:none;
  padding:var(--gap);border-radius:calc(var(--r-l) + 6px);
  background:linear-gradient(180deg,rgba(0,0,0,.34),rgba(0,0,0,.16));
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.07),0 24px 60px -24px rgba(0,0,0,.95);
}
#board.locked{pointer-events:none;filter:saturate(.45) brightness(.72)}
.tile{
  position:relative;display:grid;place-items:center;border-radius:var(--tr);
  font-size:var(--tf);font-weight:900;color:var(--tile-ink);letter-spacing:-.02em;
  background:linear-gradient(168deg,#fffdf5 0%,var(--tile) 45%,var(--tile-lo) 100%);
  box-shadow:0 var(--td) 0 #b0a488,0 calc(var(--td) + 5px) 14px -6px rgba(0,0,0,.6),inset 0 2px 0 rgba(255,255,255,.95);
  will-change:transform;transition:transform .13s var(--ease-out),box-shadow .13s,background .13s,color .13s;
  transform-style:preserve-3d;
}
.tile span{pointer-events:none;display:block;transform:translateY(calc(var(--td) * -.34))}
.tile .qu{font-size:.72em}
.tile::after{content:"";position:absolute;left:18%;right:18%;bottom:11%;height:3px;border-radius:2px;
  background:currentColor;opacity:0;transition:opacity .15s}
.tile.rot::after{opacity:.32}
.tile.sel{
  background:linear-gradient(168deg,#c2a4ff,var(--grape) 48%,var(--grape-lo));
  color:#fff;
  box-shadow:0 var(--td) 0 #3f1a95,0 0 0 3px rgba(255,255,255,.28),0 0 26px 2px rgba(139,92,246,.75),inset 0 2px 0 rgba(255,255,255,.4);
  transform:scale(1.07);z-index:3;
}
#board.ok .tile.sel{background:linear-gradient(168deg,#9dffd0,var(--mint) 48%,#17b06e);box-shadow:0 var(--td) 0 #0c7d4c,0 0 0 3px rgba(255,255,255,.3),0 0 28px 3px rgba(61,220,151,.8),inset 0 2px 0 rgba(255,255,255,.45)}
#board.dup .tile.sel{background:linear-gradient(168deg,#ffd9a0,var(--tang) 48%,#e07a00);box-shadow:0 var(--td) 0 #9c5500,0 0 0 3px rgba(255,255,255,.28),0 0 24px 2px rgba(255,159,67,.7),inset 0 2px 0 rgba(255,255,255,.4)}
.tile.head{transform:scale(1.15)}
.tile.pop{animation:tilePop .34s var(--ease-back)}
@keyframes tilePop{0%{transform:scale(1.07)}45%{transform:scale(1.3)}100%{transform:scale(1)}}
.tile.bad{animation:tileBad .38s ease-in-out}
@keyframes tileBad{0%,100%{transform:translateX(0)}22%{transform:translateX(-6px) rotate(-3deg)}44%{transform:translateX(6px) rotate(3deg)}68%{transform:translateX(-4px)}}
.tile.deal{animation:deal .5s var(--ease-back) both}
@keyframes deal{from{opacity:0;transform:translateY(-60px) rotateX(-80deg) scale(.6)}to{opacity:1;transform:none}}
#trail{position:absolute;inset:0;pointer-events:none;z-index:6;overflow:visible}
#trail polyline{fill:none;stroke-linejoin:round;stroke-linecap:round;stroke:rgba(139,92,246,.55);
  filter:drop-shadow(0 0 8px rgba(139,92,246,.9))}
#board.ok #trail polyline{stroke:rgba(61,220,151,.62);filter:drop-shadow(0 0 9px rgba(61,220,151,.95))}
#board.dup #trail polyline{stroke:rgba(255,159,67,.6);filter:drop-shadow(0 0 9px rgba(255,159,67,.9))}

/* floating word bubble */
#bubble{position:absolute;left:50%;top:-10px;transform:translate(-50%,-100%);z-index:8;pointer-events:none;
  display:flex;align-items:center;gap:9px;padding:9px 18px;border-radius:99px;white-space:nowrap;
  background:rgba(18,10,42,.92);box-shadow:0 0 0 2px rgba(255,255,255,.16),0 12px 28px -10px #000;
  font-size:clamp(21px,6.2vw,30px);font-weight:900;letter-spacing:.09em;
  opacity:0;transition:opacity .13s,transform .18s var(--ease-back)}
#bubble.on{opacity:1;transform:translate(-50%,-100%) scale(1)}
#bubble.ok{background:linear-gradient(180deg,#3ddc97,#17b06e);box-shadow:0 0 0 2px rgba(255,255,255,.3),0 0 30px rgba(61,220,151,.6);color:#04331f}
#bubble.dup{background:linear-gradient(180deg,#ff9f43,#e07a00);color:#3d1d00}
#bubble .pts{font-size:.62em;padding:3px 9px;border-radius:99px;background:rgba(0,0,0,.28);letter-spacing:0}
#bubble.ok .pts{background:rgba(255,255,255,.34)}

/* score floaters */
.floater{position:fixed;z-index:70;pointer-events:none;font-size:26px;font-weight:900;
  color:var(--gold);text-shadow:0 3px 10px rgba(0,0,0,.7);animation:floatUp .95s var(--ease-out) forwards}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,0) scale(.6)}18%{opacity:1;transform:translate(-50%,-16px) scale(1.18)}100%{opacity:0;transform:translate(-50%,-92px) scale(.92)}}

/* found words strip */
#found{flex:0 0 auto;padding-top:8px}
#found .hdr{display:flex;justify-content:space-between;align-items:baseline;padding:0 3px 6px;font-size:11px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);font-weight:900}
#fchips{display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;padding:2px 3px 8px;scrollbar-width:none;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 12px,#000 calc(100% - 12px),transparent)}
#fchips::-webkit-scrollbar{display:none}
#fchips:empty::before{content:"Swipe letters to make words";color:var(--ink-faint);font-size:13px;font-weight:700;padding:6px 4px;letter-spacing:0;text-transform:none}
.chip{flex:0 0 auto;padding:7px 12px;border-radius:99px;font-size:14px;font-weight:900;letter-spacing:.06em;
  background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.14);
  animation:chipIn .42s var(--ease-back) both}
.chip b{margin-left:6px;font-size:11px;color:var(--gold);letter-spacing:0}
@keyframes chipIn{from{opacity:0;transform:scale(.4) translateY(10px)}to{opacity:1;transform:none}}
.chip.big{background:linear-gradient(180deg,rgba(255,210,63,.32),rgba(240,165,0,.18));box-shadow:inset 0 0 0 1.5px rgba(255,210,63,.5)}

/* countdown */
#cd{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:rgba(10,5,26,.72);backdrop-filter:blur(10px)}
#cd b{font-size:min(38vw,220px);font-weight:900;line-height:1;
  background:linear-gradient(180deg,#fff,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 8px 26px rgba(255,190,60,.6));animation:cdPop .92s var(--ease-out)}
@keyframes cdPop{0%{opacity:0;transform:scale(2.6)}22%{opacity:1;transform:scale(1)}72%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.62)}}

/* ============================ RESULTS ============================ */
#scr-results{padding-inline:10px}
#rstage{position:fixed;inset:0;z-index:75;display:grid;place-items:center;pointer-events:none}
#rstage .slam{font-size:min(17vw,96px);font-weight:900;letter-spacing:-.02em;text-align:center;line-height:.95;
  background:linear-gradient(180deg,#fff,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 10px 30px rgba(0,0,0,.8));animation:slam 1.5s var(--ease-out) forwards}
@keyframes slam{0%{opacity:0;transform:scale(3.4) rotate(-9deg);filter:blur(14px)}
  16%{opacity:1;transform:scale(1) rotate(-3deg);filter:blur(0)}
  70%{opacity:1;transform:scale(1) rotate(-3deg)}
  100%{opacity:0;transform:scale(1.5) rotate(-3deg);filter:blur(8px)}}

#rhead{display:flex;align-items:center;gap:10px;padding:2px 4px 10px;flex:0 0 auto}
#rhead .t{flex:1;font-size:19px;font-weight:900}
#rhead .sub{font-size:11px;color:var(--ink-faint);letter-spacing:.14em;text-transform:uppercase}

#rrows{position:relative;flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;padding:2px 4px 8px}
.rrow{position:relative;display:flex;align-items:center;gap:11px;padding:11px 13px;margin-bottom:9px;border-radius:var(--r-m);
  background:rgba(255,255,255,.055);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.08);overflow:hidden;
  will-change:transform}
.rrow .fill{position:absolute;inset:0;width:0%;background:linear-gradient(90deg,var(--c),transparent);opacity:.19;
  transition:width .5s var(--ease-out)}
.rrow>*{position:relative}
.rrow .info{flex:1 1 auto;min-width:0}
.rrow .nm{font-size:15px;font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rrow .sub{font-size:11px;color:var(--ink-faint);font-weight:800;margin-top:2px}
.rrow .sc{font-size:20px;font-weight:900;font-variant-numeric:tabular-nums;color:var(--gold);min-width:66px;text-align:right}
.rrow .rk{width:26px;text-align:center;font-size:15px;font-weight:900;color:var(--ink-faint)}
.rrow.p1{background:linear-gradient(100deg,rgba(255,210,63,.2),rgba(255,255,255,.05));box-shadow:inset 0 0 0 2px rgba(255,210,63,.5)}
.rrow.p1 .rk{color:var(--gold);font-size:20px}
.rrow.mine{box-shadow:inset 0 0 0 2px rgba(255,255,255,.4)}
.rrow.p1.mine{box-shadow:inset 0 0 0 2px rgba(255,210,63,.8)}
.rrow.tick{animation:rtick .3s var(--ease-back)}
@keyframes rtick{0%{transform:scale(1)}45%{transform:scale(1.035)}100%{transform:scale(1)}}
.rrow .wstream{position:absolute;right:78px;top:50%;transform:translateY(-50%);pointer-events:none}
.wpop{position:absolute;right:0;top:0;transform:translate(0,-50%);white-space:nowrap;font-size:12px;font-weight:900;
  letter-spacing:.05em;padding:4px 9px;border-radius:99px;background:rgba(0,0,0,.55);
  box-shadow:0 0 0 1.5px rgba(255,255,255,.18);animation:wpop 1s var(--ease-out) forwards}
.wpop.uniq{background:linear-gradient(180deg,var(--gold),var(--gold-deep));color:#3a1d00;box-shadow:0 0 16px rgba(255,210,63,.8)}
.wpop.dup{opacity:.5;text-decoration:line-through}
@keyframes wpop{0%{opacity:0;transform:translate(18px,-50%) scale(.7)}
  22%{opacity:1;transform:translate(0,-50%) scale(1)}
  74%{opacity:1;transform:translate(0,-50%) scale(1)}
  100%{opacity:0;transform:translate(-14px,-50%) scale(.85)}}

#rbest{flex:0 0 auto;margin:0 4px 10px;padding:13px 16px;border-radius:var(--r-m);display:flex;align-items:center;gap:13px;
  background:linear-gradient(100deg,rgba(255,210,63,.26),rgba(255,120,180,.12));
  box-shadow:inset 0 0 0 2px rgba(255,210,63,.45);animation:bestIn .6s var(--ease-back) both}
@keyframes bestIn{from{opacity:0;transform:translateY(18px) scale(.9)}to{opacity:1;transform:none}}
#rbest .k{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:900}
#rbest .w{font-size:24px;font-weight:900;letter-spacing:.1em;line-height:1.1}
#rbest .who{font-size:12px;color:var(--ink-dim);font-weight:800;margin-top:2px}
#rbest .p{margin-left:auto;font-size:22px;font-weight:900;color:var(--gold)}

/* winner splash */
#rwin{position:fixed;inset:0;z-index:78;display:grid;place-items:center;pointer-events:none;
  background:radial-gradient(60% 45% at 50% 45%,rgba(255,210,63,.22),transparent 70%),rgba(8,4,20,.8);
  backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);animation:winFade .35s ease both}
@keyframes winFade{from{opacity:0}to{opacity:1}}
#rwin .box{text-align:center;animation:winIn .8s var(--ease-back) both}
@keyframes winIn{from{opacity:0;transform:scale(.4) translateY(40px)}to{opacity:1;transform:none}}
#rwin .av{--sz:112px;margin:0 auto 16px;animation:winFloat 2.4s ease-in-out infinite}
@keyframes winFloat{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-12px) rotate(2deg)}}
#rwin .nm{font-size:min(11vw,46px);font-weight:900;line-height:1.05;
  background:linear-gradient(180deg,#fff,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
#rwin .k{margin-top:6px;font-size:13px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);font-weight:900}
#rwin .sc{margin-top:12px;font-size:28px;font-weight:900;color:#fff}

/* tabs + word grid */
#rtabs{display:flex;gap:6px;padding:2px 4px 10px;flex:0 0 auto}
#rtabs button{flex:1;padding:10px 6px;border-radius:11px;font-size:13px;font-weight:900;color:var(--ink-dim);
  background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.09);transition:.15s}
#rtabs button.sel{color:#341c00;background:linear-gradient(180deg,#ffe071,var(--gold));box-shadow:none}
.wgrid{display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}
.wgrid .w{padding:6px 11px;border-radius:99px;font-size:13px;font-weight:900;letter-spacing:.05em;
  background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.1);
  animation:chipIn .3s var(--ease-back) both}
.wgrid .w b{margin-left:6px;font-size:10px;color:var(--gold);letter-spacing:0}
.wgrid .w.uniq{background:linear-gradient(180deg,rgba(255,210,63,.3),rgba(240,165,0,.16));box-shadow:inset 0 0 0 1.5px rgba(255,210,63,.55)}
.wgrid .w.uniq b{color:#ffe071}
.wgrid .w.dup{opacity:.55}
.wgrid .w.miss{background:rgba(255,255,255,.045);color:var(--ink-faint);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.06)}
.wsec{padding:4px 4px 14px}
.wsec .lbl{display:flex;align-items:center;gap:8px;padding:10px 2px 8px;font-size:12px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-faint);font-weight:900}

/* ============================ MISC ============================ */
#toasts{position:fixed;left:50%;top:calc(var(--safe-t) + 10px);transform:translateX(-50%);z-index:90;
  display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:92vw}
.toast{padding:11px 18px;border-radius:99px;font-size:14px;font-weight:900;
  background:rgba(18,10,42,.94);box-shadow:0 0 0 1.5px var(--glass-line),0 14px 30px -12px #000;
  animation:toastIn .4s var(--ease-back) both}
.toast.bad{background:linear-gradient(180deg,#ff5773,#c9203c)}
.toast.good{background:linear-gradient(180deg,#3ddc97,#12a565);color:#03301c}
.toast.out{animation:toastOut .3s var(--ease-out) forwards}
@keyframes toastIn{from{opacity:0;transform:translateY(-18px) scale(.85)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(-14px) scale(.9)}}

#modal{position:fixed;inset:0;z-index:95;display:none;place-items:center;padding:22px;
  background:rgba(6,3,16,.78);backdrop-filter:blur(8px)}
#modal.on{display:grid}
#modal .box{width:100%;max-width:380px;text-align:center;animation:winIn .45s var(--ease-back) both}
#modal h3{font-size:22px;font-weight:900;margin-bottom:8px}
#modal p{font-size:14px;font-weight:700;color:var(--ink-dim);line-height:1.5;margin-bottom:18px}

.iconbtn{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;flex:0 0 auto;
  background:var(--glass);box-shadow:inset 0 0 0 1.5px var(--glass-line);font-size:18px;transition:transform .12s}
.iconbtn:active{transform:scale(.9)}
.iconbtn.off{opacity:.45}

.spinner{width:34px;height:34px;border-radius:50%;border:4px solid rgba(255,255,255,.16);border-top-color:var(--gold);
  animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.bar{height:6px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--grape),var(--gold));transition:width .3s}

.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;font-size:11px;font-weight:900;
  letter-spacing:.08em;text-transform:uppercase;background:rgba(255,255,255,.1);color:var(--ink-dim)}
.pill.live{background:rgba(61,220,151,.16);color:var(--mint)}
.pill.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--mint);animation:blink 1.4s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

.scrolly{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.stack{display:flex;flex-direction:column;gap:12px}
.muted{color:var(--ink-faint);font-size:12px;font-weight:700;text-align:center;line-height:1.5}

/* wide screens: two-column game */
@media (min-width:900px) and (orientation:landscape){
  .screen{padding-inline:24px}
  #scr-game{display:none}
  #scr-game.on{display:grid;grid-template-columns:1fr minmax(260px,320px);grid-template-rows:auto 1fr;gap:0 22px;
    align-items:stretch;width:100%;max-width:1080px;margin-inline:auto}
  #gtop{grid-column:1/-1}
  #boardwrap{grid-column:1;grid-row:2}
  #found{grid-column:2;grid-row:2;min-height:0;display:flex;flex-direction:column;padding-top:0;align-self:stretch}
  #fchips{flex-direction:column;overflow-x:hidden;overflow-y:auto;align-items:flex-start;
    -webkit-mask-image:linear-gradient(180deg,transparent,#000 12px,#000 calc(100% - 12px),transparent)}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important}
  #bg i{animation:none}
}
</style>
</head>
<body>
<div id="bg"><i></i><i></i><i></i><i></i></div>
<canvas id="fx"></canvas>

<main id="app">

  <!-- ============ LOADING ============ -->
  <section id="scr-load" class="screen on center">
    <div class="brand"><div class="word" id="brandload"></div></div>
    <div class="row" style="margin-top:34px;gap:14px"><div class="spinner"></div>
      <div style="font-size:14px;color:var(--ink-dim);font-weight:800" id="loadmsg">Loading dictionary…</div></div>
    <div class="bar" style="width:min(260px,70vw);margin-top:18px"><i id="loadbar"></i></div>
  </section>

  <!-- ============ HOME ============ -->
  <section id="scr-home" class="screen">
    <div class="grow scrolly center" style="gap:0">
      <div class="wrap center">
        <div class="brand"><div class="word" id="brandhome"></div></div>
        <p class="tag">Swipe fast. Score big. Beat your friends.</p>

        <div class="stack" style="width:100%;margin-top:30px">
          <div class="row" style="gap:10px">
            <button class="av" id="avbtn" style="--sz:56px" title="Change colour"></button>
            <label class="field" style="flex:1"><input id="nameIn" maxlength="14" placeholder="Your name" autocomplete="nickname" spellcheck="false"></label>
          </div>
          <button class="btn primary" id="btnSolo"><span class="shine"></span>▶ Play solo</button>
          <button class="btn grape" id="btnHost">✨ Create a lobby</button>
          <div class="row" style="gap:8px">
            <label class="field" style="flex:1"><input id="codeIn" class="code" maxlength="4" placeholder="CODE" autocomplete="off" spellcheck="false" inputmode="text"></label>
            <button class="btn ghost sm" id="btnJoin" style="height:58px;padding-inline:20px">Join</button>
          </div>
        </div>
        <p class="muted" style="margin-top:22px">Up to 8 players · peer-to-peer · no accounts</p>
        <div class="row" style="margin-top:16px;gap:8px">
          <button class="iconbtn" id="btnSound" title="Sound">🔊</button>
          <button class="iconbtn" id="btnHelp" title="How to play">?</button>
        </div>
      </div>
    </div>
  </section>

  <!-- ============ LOBBY ============ -->
  <section id="scr-lobby" class="screen">
    <div class="row" style="flex:0 0 auto;padding-bottom:10px">
      <button class="iconbtn" id="btnLeave">←</button>
      <div style="flex:1"><div style="font-size:19px;font-weight:900">Lobby</div>
        <div id="lobbyState" class="pill live" style="margin-top:3px">Connected</div></div>
      <button class="iconbtn" id="btnSound2" title="Sound">🔊</button>
    </div>

    <div class="grow scrolly">
      <div class="wrap stack">
        <div class="codebox" id="codebox">
          <div class="lbl">Room code</div>
          <div class="val" id="codeVal"></div>
          <button class="btn ghost sm" id="btnShare" style="margin-top:4px">🔗 Copy invite link</button>
        </div>

        <div class="card">
          <h2 class="hd" style="margin-bottom:11px">Players <span id="pcount" style="color:var(--gold)"></span></h2>
          <div id="plist"></div>
        </div>

        <div class="card">
          <h2 class="hd" style="margin-bottom:13px">Settings <span id="setLock" style="color:var(--ink-faint);text-transform:none;letter-spacing:0"></span></h2>
          <div class="stack" id="setWrap">
            <div class="opt" data-k="size"><h2 class="hd">Board</h2><div class="seg"></div></div>
            <div class="opt" data-k="dur"><h2 class="hd">Round length</h2><div class="seg"></div></div>
            <div class="opt" data-k="minLen"><h2 class="hd">Minimum word</h2><div class="seg"></div></div>
          </div>
        </div>
      </div>
    </div>

    <div class="wrap" style="flex:0 0 auto;padding-top:10px">
      <button class="btn primary" id="btnStart"><span class="shine"></span>Start game</button>
      <p class="muted" id="waitMsg" style="margin-top:10px"></p>
    </div>
  </section>

  <!-- ============ GAME ============ -->
  <section id="scr-game" class="screen">
    <div id="gtop">
      <div class="ring" id="ring">
        <svg viewBox="0 0 60 60"><circle class="trk" cx="30" cy="30" r="25"></circle><circle class="bar" id="ringBar" cx="30" cy="30" r="25"></circle></svg>
        <b id="ringNum">60</b>
      </div>
      <div id="gscore"><div class="n mono" id="scoreNum">0</div><div class="l" id="scoreLbl">points</div></div>
      <div id="gpips"></div>
    </div>
    <div id="boardwrap">
      <div id="board"><svg id="trail"></svg><div id="bubble"><span id="bubbleW"></span><span class="pts" id="bubbleP"></span></div></div>
    </div>
    <div id="found">
      <div class="hdr"><span id="foundLbl">Your words</span><span id="foundCt" style="color:var(--gold)"></span></div>
      <div id="fchips"></div>
    </div>
  </section>

  <!-- ============ RESULTS ============ -->
  <section id="scr-results" class="screen">
    <div id="rhead">
      <div class="t">Results<div class="sub" id="rsub"></div></div>
      <button class="iconbtn" id="btnRSound">🔊</button>
      <button class="btn ghost sm" id="btnSkip">Skip ⏭</button>
    </div>
    <div id="rbest" class="hide"></div>
    <div id="rtabs" class="hide">
      <button data-t="rank" class="sel">Ranking</button>
      <button data-t="words">Words</button>
      <button data-t="all">Board</button>
    </div>
    <div id="rrows" class="scrolly"></div>
    <div class="wrap" style="flex:0 0 auto;padding-top:10px">
      <button class="btn primary" id="btnAgain"><span class="shine"></span>Play again</button>
      <p class="muted" id="againMsg" style="margin-top:10px"></p>
    </div>
  </section>

</main>

<div id="toasts"></div>
<div id="modal"><div class="box card"><h3 id="mTitle"></h3><p id="mBody"></p><div id="mBtns" class="stack"></div></div></div>

'use strict';

/* ----------------------------- tiny dom ----------------------------- */
const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const el = (tag, cls, txt) => { const n = document.createElement(tag); if (cls) n.className = cls; if (txt != null) n.textContent = txt; return n; };
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rnd = n => Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];
const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1);[a[i], a[j]] = [a[j], a[i]]; } return a; }

/* ============================ LEXICON ============================
   One giant string of every word, back to back, plus a Uint32Array of
   start offsets. Lookups are binary searches that compare characters in
   place, so we never allocate a substring while solving. Words are in
   plain ASCII sort order, which makes any prefix a contiguous range —
   effectively a trie without building one.
   ================================================================== */
const Lex = (() => {
  let BLOB = '', OFF = null, NW = 0;

  const codeAt = (i, d) => { const p = OFF[i] + d; return p < OFF[i + 1] ? BLOB.charCodeAt(p) : 0; };
  const lenOf = i => OFF[i + 1] - OFF[i];
  const at = i => BLOB.slice(OFF[i], OFF[i + 1]);

  function lowerB(lo, hi, d, c) { while (lo < hi) { const m = (lo + hi) >> 1; if (codeAt(m, d) < c) lo = m + 1; else hi = m; } return lo; }
  function upperB(lo, hi, d, c) { while (lo < hi) { const m = (lo + hi) >> 1; if (codeAt(m, d) <= c) lo = m + 1; else hi = m; } return lo; }

  /** Narrow the range of words sharing a d-char prefix to those with char c at index d. */
  function step(lo, hi, d, c) { const a = lowerB(lo, hi, d, c); return [a, upperB(a, hi, d, c)]; }

  function isWord(w) {
    let lo = 0, hi = NW;
    for (let d = 0; d < w.length; d++) {
      [lo, hi] = step(lo, hi, d, w.charCodeAt(d));
      if (lo >= hi) return false;
    }
    return lenOf(lo) === w.length;
  }

  function b64bytes(b64) {
    const bin = atob(b64), n = bin.length, out = new Uint8Array(n);
    for (let i = 0; i < n; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  async function load(payload, onProg) {
    if (typeof DecompressionStream !== 'function') throw new Error('This browser is too old (needs DecompressionStream).');
    onProg && onProg(.08, 'Unpacking dictionary…');
    const stream = new Blob([b64bytes(payload)]).stream().pipeThrough(new DecompressionStream('gzip'));
    const buf = await new Response(stream).arrayBuffer();
    const txt = new TextDecoder().decode(buf);
    onProg && onProg(.4, 'Indexing 267,000 words…');
    await sleep(16);

    const nl = txt.indexOf('\n');
    NW = parseInt(txt.slice(0, nl), 10);
    const parts = new Array(NW);
    OFF = new Uint32Array(NW + 1);
    let i = nl + 1, k = 0, pos = 0, prev = '';
    const L = txt.length;
    while (k < NW) {
      const shared = txt.charCodeAt(i++) - 32;
      let j = i;
      while (j < L && txt.charCodeAt(j) >= 65) j++;         // markers are 32..63, letters 65..90
      const w = (shared ? prev.slice(0, shared) : '') + txt.slice(i, j);
      parts[k] = w; OFF[k] = pos; pos += w.length; prev = w; i = j; k++;
      if ((k & 65535) === 0) { onProg && onProg(.4 + .5 * k / NW, 'Indexing 267,000 words…'); }
    }
    OFF[NW] = pos;
    BLOB = parts.join('');
    onProg && onProg(1, 'Ready');
  }

  return { load, isWord, step, lenOf, at, get size() { return NW; }, get root() { return [0, NW]; } };
})();

  for (let r = 0; r < size; r++) for (let c = 0; c < size; c++) {
    const list = [];
    for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
      if (!dr && !dc) continue;
      const nr = r + dr, nc = c + dc;
      if (nr >= 0 && nr < size && nc >= 0 && nc < size) list.push(nr * size + nc);
    }
    a.push(list);
  }
  return (ADJ_CACHE[size] = a);
}

function rollDice(size) {
  const dice = shuffle(DICE[size].slice());
  return dice.map(d => { const f = d[rnd(6)]; return f === 'Q' ? 'QU' : f; });
}

/* ============================= SOLVER ============================= */
function solveBoard(board, size, minLen) {
  const adj = adjacency(size), n = size * size;
  const used = new Uint8Array(n);
  const found = new Set();
  const buf = [];

  function walk(i, lo, hi, depth) {
    const face = board[i];
    let a = lo, b = hi, d = depth;
    for (let k = 0; k < face.length; k++) {
      [a, b] = Lex.step(a, b, d, face.charCodeAt(k));
      if (a >= b) return;
      d++;
    }
    buf.push(face);
    if (d >= minLen && Lex.lenOf(a) === d) found.add(buf.join(''));
    used[i] = 1;
    const nb = adj[i];
    for (let k = 0; k < nb.length; k++) if (!used[nb[k]]) walk(nb[k], a, b, d);
    used[i] = 0;
    buf.pop();
  }

  const [r0, r1] = Lex.root;
  for (let i = 0; i < n; i++) walk(i, r0, r1, 0);
  return Array.from(found);
}

/** Find a legal chain of cells spelling `word`, or null. */
function findPath(board, size, word) {
  const adj = adjacency(size), n = size * size;
  const used = new Uint8Array(n), path = [];
  function go(i, pos) {
    const face = board[i];
    if (word.substr(pos, face.length) !== face) return false;
    const np = pos + face.length;
    used[i] = 1; path.push(i);
    if (np === word.length) return true;
    const nb = adj[i];
    for (let k = 0; k < nb.length; k++) if (!used[nb[k]] && go(nb[k], np)) return true;
    used[i] = 0; path.pop();
    return false;
  }
  for (let i = 0; i < n; i++) { if (go(i, 0)) return path.slice(); }
  return null;
}

/** Roll boards until we get one that's actually fun to play. */
function makeBoard(size, minLen) {
  const target = { 4: 90, 5: 240, 6: 500 }[size] / (minLen === 3 ? 1 : minLen === 4 ? 2.1 : 4.4);
  let best = null, bestWords = null;
  for (let attempt = 0; attempt < 9; attempt++) {
    const b = rollDice(size);
    const w = solveBoard(b, size, minLen);
    if (!best || w.length > bestWords.length) { best = b; bestWords = w; }
    if (w.length >= target) break;
  }
  return { board: best, words: bestWords };
}

   Longer words climb steeply; a word nobody else found doubles.

/* ============================== AUDIO =============================
   Everything is synthesised, so the whole game stays one file.
   ================================================================== */
const Sound = (() => {
  let ctx = null, master = null, on = true;
  try { on = localStorage.getItem('sb.sound') !== '0'; } catch (e) { }

  function init() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = .3;
    master.connect(ctx.destination);
  }
  const t0 = () => ctx.currentTime;

  function tone(f, dur, { type = 'sine', vol = 1, at = 0, to = null, atk = .006 } = {}) {
    if (!on || !ctx) return;
    const t = t0() + at;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (to) o.frequency.exponentialRampToValueAtTime(Math.max(20, to), t + dur);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + atk);
    g.gain.exponentialRampToValueAtTime(.0008, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + .04);
  }
  function noise(dur, { vol = .5, at = 0, hp = 700 } = {}) {
    if (!on || !ctx) return;
    const t = t0() + at, n = Math.floor(ctx.sampleRate * dur);
    const b = ctx.createBuffer(1, n, ctx.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = ctx.createBufferSource(); s.buffer = b;
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    const g = ctx.createGain(); g.gain.value = vol;
    s.connect(f); f.connect(g); g.connect(master); s.start(t);
  }

  const SC = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24, 26, 28, 31];   // pentatonic ladder
  const hz = semi => 261.63 * Math.pow(2, semi / 12);

  return {
    init,
    get on() { return on; },
    toggle() { on = !on; try { localStorage.setItem('sb.sound', on ? '1' : '0'); } catch (e) { } if (on) { init(); this.tick(2); } return on; },
    tick(n) { init(); tone(hz(SC[Math.min(n, SC.length - 1)] + 12), .1, { type: 'triangle', vol: .5 }); },
    back() { init(); tone(330, .07, { type: 'sine', vol: .3, to: 240 }); },
    good(len) {
      init();
      const steps = Math.min(6, Math.max(3, len - 1));
      for (let i = 0; i < steps; i++) tone(hz(SC[i + 3] + 12), .22, { type: 'triangle', vol: .34, at: i * .045 });
      tone(hz(SC[steps + 3] + 24), .5, { type: 'sine', vol: .2, at: steps * .045 });
    },
    bad() { init(); tone(180, .22, { type: 'sawtooth', vol: .18, to: 90 }); noise(.1, { vol: .1, hp: 300 }); },
    dup() { init(); tone(420, .09, { type: 'square', vol: .13 }); tone(340, .11, { type: 'square', vol: .1, at: .07 }); },
    count(n) { init(); tone(n <= 0 ? 880 : 520, n <= 0 ? .5 : .16, { type: 'triangle', vol: .4 }); },
    go() { init();[0, 4, 7, 12].forEach((s, i) => tone(hz(s + 12), .6, { type: 'triangle', vol: .3, at: i * .05 })); },
    warn() { init(); tone(700, .09, { type: 'square', vol: .18 }); },
    end() { init();[0, -5].forEach((s, i) => tone(hz(s), 1.1, { type: 'sawtooth', vol: .16, at: i * .12, to: hz(s - 12) })); noise(.5, { vol: .12, hp: 200 }); },
    pop(i) { init(); tone(hz(SC[Math.min(i, 9)] + 24), .09, { type: 'sine', vol: .22 }); },
    coin() { init(); tone(1180, .07, { type: 'square', vol: .16 }); tone(1560, .18, { type: 'square', vol: .14, at: .06 }); },
    whoosh() { init(); noise(.34, { vol: .1, hp: 1200 }); },
    fanfare() {
      init();
      [[0, 0], [4, .12], [7, .24], [12, .36], [7, .5], [12, .58], [16, .7], [19, .82]]
        .forEach(([s, t]) => { tone(hz(s + 12), .55, { type: 'triangle', vol: .3, at: t }); tone(hz(s), .55, { type: 'sine', vol: .18, at: t }); });
      noise(.8, { vol: .07, hp: 2200, at: .36 });
    },
    join() { init(); tone(hz(7), .16, { type: 'triangle', vol: .26 }); tone(hz(12), .3, { type: 'triangle', vol: .22, at: .1 }); },
    part() { init(); tone(hz(7), .16, { type: 'triangle', vol: .2 }); tone(hz(0), .3, { type: 'triangle', vol: .16, at: .1 }); },
  };
})();

const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) { } };

/* ============================ PARTICLES =========================== */
const FX = (() => {
  const cv = $('#fx'), cx = cv.getContext('2d');
  let parts = [], raf = 0, W = 0, H = 0, dpr = 1;

  function size() {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  addEventListener('resize', size);
  size();

  function loop() {
    cx.clearRect(0, 0, W, H);
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.vy += p.g; p.vx *= p.d; p.vy *= p.d;
      p.x += p.vx; p.y += p.vy; p.a += p.va; p.life--;
      if (p.life <= 0 || p.y > H + 60) { parts.splice(i, 1); continue; }
      cx.save();
      cx.translate(p.x, p.y); cx.rotate(p.a);
      cx.globalAlpha = clamp(p.life / 34, 0, 1);
      cx.fillStyle = p.c;
      if (p.sh === 'r') cx.fillRect(-p.s * .5, -p.s * .22, p.s, p.s * .44);
      else { cx.beginPath(); cx.arc(0, 0, p.s * .42, 0, 6.283); cx.fill(); }
      cx.restore();
    }
    raf = parts.length ? requestAnimationFrame(loop) : 0;
  }
  const start = () => { if (!raf) raf = requestAnimationFrame(loop); };

  const HUES = ['#ffd23f', '#ff5773', '#3ddc97', '#8b5cf6', '#3bc9ff', '#ff9f43', '#f472b6', '#ffffff'];

  return {
    burst(x, y, n = 34, spread = 6.283, dir = -1.57, power = 9, colors = HUES) {
      for (let i = 0; i < n; i++) {
        const ang = dir + (Math.random() - .5) * spread, sp = power * (.35 + Math.random());
        parts.push({
          x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, g: .28, d: .985,
          a: Math.random() * 6.28, va: (Math.random() - .5) * .3,
          s: 5 + Math.random() * 8, c: pick(colors), sh: Math.random() < .65 ? 'r' : 'c',
          life: 70 + rnd(60),
        });
      }
      start();
    },
    rain(n = 130) {
      for (let i = 0; i < n; i++) {
        parts.push({
          x: Math.random() * W, y: -30 - Math.random() * H * .7,
          vx: (Math.random() - .5) * 2.4, vy: 1 + Math.random() * 3, g: .09, d: .996,
          a: Math.random() * 6.28, va: (Math.random() - .5) * .22,
          s: 6 + Math.random() * 9, c: pick(HUES), sh: Math.random() < .7 ? 'r' : 'c',
          life: 260 + rnd(160),
        });
      }
      start();
    },
    clear() { parts.length = 0; cx.clearRect(0, 0, W, H); },
  };
})();

/** Animate a number from a→b with an ease-out so tallies feel alive. */
function odometer(node, from, to, ms, done) {
  if (from === to) { node.textContent = to.toLocaleString(); done && done(); return () => { }; }
  const t0 = performance.now();
  let raf = 0;
  const tick = now => {
    const p = clamp((now - t0) / ms, 0, 1);
    const e = 1 - Math.pow(1 - p, 3);
    node.textContent = Math.round(from + (to - from) * e).toLocaleString();
    if (p < 1) raf = requestAnimationFrame(tick); else done && done();
  };
  raf = requestAnimationFrame(tick);
  return () => cancelAnimationFrame(raf);
}

/* ==== 20_net.js ==== */
/* =====================================================================
   NETWORKING — star topology over WebRTC (PeerJS)
   The host is the hub and the single source of truth; guests only ever
   talk to the host. With a cap of 8 players that's 7 connections, which
   is far cheaper than a full mesh and keeps state trivially consistent.
   ===================================================================== */

const CODE_ALPHABET = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';   // no I/O/0/1 lookalikes
const ROOM_PREFIX = 'swbgl3-';
const MAX_PLAYERS = 8;

const Net = (() => {
  let peer = null, isHost = false, code = '', me = '', open = false;
  const conns = new Map();          // host: playerId -> DataConnection
  let hostConn = null;              // guest: connection to host
  let hb = 0;

  const H = {
    msg: () => { }, peerOpen: () => { }, peerClose: () => { },
    hostGone: () => { }, netError: () => { }, statusChange: () => { },
  };

  const newCode = () => Array.from({ length: 4 }, () => pick(CODE_ALPHABET.split(''))).join('');

  function makePeer(id) {
    return new Peer(id, {
      debug: 0,
      config: {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' },
          { urls: 'stun:global.stun.twilio.com:3478' },
        ],
      },
    });
  }

  function destroy() {
    clearInterval(hb); hb = 0;
    conns.forEach(c => { try { c.close(); } catch (e) { } });
    conns.clear();
    hostConn = null;
    if (peer) { try { peer.destroy(); } catch (e) { } }
    peer = null; open = false; isHost = false; code = '';
  }

  /* ------------------------------- host ------------------------------- */
  function host(attempt) {
    attempt = attempt || 0;
    return new Promise((resolve, reject) => {
      if (attempt === 0) destroy();
      const c = newCode();
      const p = makePeer(ROOM_PREFIX + c);
      let settled = false;

      const fail = err => {
        if (settled) return;
        if (err && err.type === 'unavailable-id' && attempt < 5) {
          settled = true;
          try { p.destroy(); } catch (e) { }
          resolve(host(attempt + 1));
          return;
        }
        settled = true;
        try { p.destroy(); } catch (e) { }
        reject(err || new Error('Could not reach the matchmaking server.'));
      };

      const guard = setTimeout(() => fail(new Error('Timed out reaching the matchmaking server.')), 15000);

      p.on('open', () => {
        if (settled) return;
        settled = true; clearTimeout(guard);
        peer = p; isHost = true; code = c; me = p.id; open = true;
        wireHost();
        resolve(c);
      });
      p.on('error', fail);
    });
  }

  function wireHost() {
    peer.on('connection', conn => {
      if (conns.size >= MAX_PLAYERS - 1) {
        conn.on('open', () => { try { conn.send({ t: 'full' }); } catch (e) { } setTimeout(() => conn.close(), 400); });
        return;
      }
      conn.on('open', () => { conns.set(conn.peer, conn); H.peerOpen(conn.peer); });
      conn.on('data', d => H.msg(conn.peer, d));
      conn.on('close', () => { if (conns.delete(conn.peer)) H.peerClose(conn.peer); });
      conn.on('error', () => { if (conns.delete(conn.peer)) H.peerClose(conn.peer); });
    });
    peer.on('error', e => {
      if (e && (e.type === 'peer-unavailable' || e.type === 'network')) return;
      H.netError(e);
    });
    peer.on('disconnected', () => { H.statusChange('reconnecting'); try { peer.reconnect(); } catch (e) { } });
    // Keeps NAT bindings warm and gives us a liveness signal.
    hb = setInterval(() => broadcast({ t: 'hb' }), 5000);
  }

  /* ------------------------------ guest ------------------------------ */
  function join(roomCode) {
    destroy();
    const target = ROOM_PREFIX + roomCode.toUpperCase();
    return new Promise((resolve, reject) => {
      const p = makePeer(undefined);
      let settled = false;
      const fail = err => {
        if (settled) return;
        settled = true; clearTimeout(guard);
        try { p.destroy(); } catch (e) { }
        reject(err);
      };
      const guard = setTimeout(() => fail(new Error("Couldn't reach that room. Check the code?")), 20000);

      p.on('error', e => {
        if (e && e.type === 'peer-unavailable') return fail(new Error('No lobby with that code is open right now.'));
        fail(e);
      });

      p.on('open', () => {
        const c = p.connect(target, { reliable: true, metadata: { v: 1 } });
        c.on('open', () => {
          if (settled) return;
          settled = true; clearTimeout(guard);
          peer = p; isHost = false; code = roomCode.toUpperCase(); me = p.id; hostConn = c; open = true;
          c.on('data', d => H.msg('host', d));
          c.on('close', () => { if (open) { open = false; H.hostGone(); } });
          c.on('error', () => { if (open) { open = false; H.hostGone(); } });
          p.on('disconnected', () => { try { p.reconnect(); } catch (e) { } });
          resolve();
        });
        c.on('error', () => fail(new Error("Couldn't connect to the host.")));
      });
    });
  }

  /* ------------------------------ send ------------------------------- */
  function sendTo(id, msg) {
    const c = conns.get(id);
    if (c && c.open) { try { c.send(msg); } catch (e) { } }
  }
  function broadcast(msg, exceptId) {
    conns.forEach((c, id) => { if (id !== exceptId && c.open) { try { c.send(msg); } catch (e) { } } });
  }
  function toHost(msg) {
    if (hostConn && hostConn.open) { try { hostConn.send(msg); } catch (e) { } }
  }
  function kick(id) {
    const c = conns.get(id);
    if (c) { try { c.send({ t: 'kick' }); } catch (e) { } setTimeout(() => { try { c.close(); } catch (e) { } }, 300); }
  }

  return {
    host, join, destroy, sendTo, broadcast, toHost, kick,
    handlers: H,
    get isHost() { return isHost; },
    get code() { return code; },
    get me() { return me; },
    get online() { return open; },
    get peerIds() { return Array.from(conns.keys()); },
    get count() { return conns.size; },
  };
})();
