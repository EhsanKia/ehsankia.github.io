  $('#codebox').classList.toggle('hide', solo);
  $('#lobbyState').classList.toggle('hide', solo);

  if (!solo) {
    const cv = $('#codeVal');
    if (cv.dataset.code !== Net.code) {
      cv.dataset.code = Net.code; cv.innerHTML = '';
      Net.code.split('').forEach((ch, i) => { const b = el('b', null, ch); b.style.animationDelay = (i * .07) + 's'; cv.appendChild(b); });
    }
  }

  const list = $('#plist'); list.innerHTML = '';
  const ps = roster().sort((a, b) => (b.host ? 1 : 0) - (a.host ? 1 : 0));
  ps.forEach((p, i) => {
    const row = el('div', 'pcard');
    row.style.animationDelay = (i * .05) + 's';
    row.appendChild(avatar(p, 40, p.host ? 'crown' : ''));
    row.appendChild(el('div', 'nm', p.name));
    if (p.id === G.me.id) row.appendChild(el('span', 'badge you', 'You'));
    else if (p.host) row.appendChild(el('span', 'badge host', 'Host'));
    if (G.mode === 'host' && p.id !== G.me.id) {
      const k = el('button', 'iconbtn', '✕');
      k.style.cssText = 'width:32px;height:32px;font-size:13px';
      k.title = 'Remove player';
      k.onclick = () => Net.kick(p.id);
      row.appendChild(k);
    }
    list.appendChild(row);
  });
  $('#pcount').textContent = solo ? '' : activeCount() + '/' + MAX_PLAYERS;

  const start = $('#btnStart'), wait = $('#waitMsg');
  if (canControl()) {
    start.classList.remove('hide');
    start.disabled = false;
    start.innerHTML = '<span class="shine"></span>' + (solo ? 'Start round' : 'Start game · ' + activeCount() + (activeCount() === 1 ? ' player' : ' players'));
    wait.textContent = solo ? '' : activeCount() < 2 ? 'Share the code — or start solo, others can drop in later.' : 'Everyone in? Hit start.';
  } else {
    start.classList.add('hide');
    wait.textContent = 'Waiting for the host to start the round…';
  }
  renderSettings();
}

/* ===================================================================
   ROUND LIFECYCLE
   =================================================================== */
function hostStartRound() {
  if (!canControl()) return;
  const s = G.settings;
  Sound.whoosh();
  $('#btnStart').disabled = true;
  $('#btnAgain').disabled = true;
  $('#waitMsg').textContent = 'Shaking the box…';

  // Yield first so the button state paints before the (blocking) solve.
  setTimeout(() => {
    const { board, words } = makeBoard(s.size, s.minLen);
    const rid = Date.now();
    const payload = { t: 'start', rid, board, size: s.size, minLen: s.minLen, dur: s.dur, total: words.length };
    if (G.mode === 'host') Net.broadcast(payload);
    G.hostBoardWords = words;
    beginRound(payload, false);
    $('#btnStart').disabled = false;
    $('#btnAgain').disabled = false;
  }, 30);
}

function beginRound(p, spectate) {
  Results.stop();
  FX.clear();
  cancelAnimationFrame(timerRaf);
  G.round = {
    rid: p.rid, board: p.board, size: p.size, minLen: p.minLen, dur: p.dur,
    total: p.total || 0, words: new Map(), score: 0,
    spectate: !!spectate, ended: false, endAt: 0,
  };
  G.results = null;
  roster().forEach(pl => { pl.found = 0; });

  show('game');
  Board.mount(p.board, p.size);
  $('#fchips').innerHTML = '';
  $('#foundCt').textContent = '';
  $('#scoreNum').textContent = '0';
  $('#foundLbl').textContent = spectate ? 'Round in progress' : 'Your words';
  $('#scoreLbl').textContent = spectate ? 'spectating' : 'points';
  renderPips();

  if (spectate) {
    Board.lock(true);
    G.round.endAt = performance.now() + (p.remain || p.dur * 1000);
    runTimer();
    toast('Round already started — you\'re in next one!', null, 3200);
    return;
  }
  Board.lock(true);
  countdownThen(() => {
    Board.lock(false);
    G.round.endAt = performance.now() + p.dur * 1000;
    runTimer();
  });
}

function countdownThen(fn) {
  const ov = el('div'); ov.id = 'cd';
  const b = el('b'); ov.appendChild(b);
  document.body.appendChild(ov);
  let n = 3;
  const step = () => {
    if (n > 0) { b.textContent = n; Sound.count(n); }
    else { b.textContent = 'GO!'; Sound.go(); buzz([12, 40, 26]); }
    b.style.animation = 'none'; void b.offsetWidth; b.style.animation = '';
    if (n < 0) { ov.remove(); fn(); return; }
    n--; setTimeout(step, 900);
  };
  step();
}

let timerRaf = 0;
function runTimer() {
  const R = G.round, ring = $('#ring'), bar = $('#ringBar'), num = $('#ringNum');
  const C = 2 * Math.PI * 25;
  bar.style.strokeDasharray = C;
  let lastSec = -1;
  cancelAnimationFrame(timerRaf);

  const tick = () => {
    if (!G.round || G.round !== R || R.ended) return;
    const left = Math.max(0, R.endAt - performance.now());
    const frac = clamp(left / (R.dur * 1000), 0, 1);
    bar.style.strokeDashoffset = C * (1 - frac);
    const sec = Math.ceil(left / 1000);
    if (sec !== lastSec) {
      lastSec = sec;
      num.textContent = sec;
      ring.classList.toggle('warn', sec <= 20 && sec > 10);
      ring.classList.toggle('crit', sec <= 10);
      if (sec <= 5 && sec > 0) { Sound.warn(); buzz(10); }
    }
    if (left <= 0) { endRound(); return; }
    timerRaf = requestAnimationFrame(tick);
  };
  tick();
}

function endRound() {
  const R = G.round;
  if (!R || R.ended) return;
  R.ended = true;
  cancelAnimationFrame(timerRaf);
  Board.lock(true);
  Board.cancel();
  Sound.end(); buzz([26, 60, 26]);

  const mine = Array.from(R.words.keys());

  if (G.mode === 'guest') {
    Net.toHost({ t: 'done', rid: R.rid, words: mine });
    showWaitingForResults();
  } else if (G.mode === 'host') {
    G.pendingDone = new Set(Net.peerIds);
    G.doneWords = new Map([[G.me.id, mine]]);
    showWaitingForResults();
    clearTimeout(G.doneTimer);
    G.doneTimer = setTimeout(finaliseResults, 6000);
    if (!G.pendingDone.size) finaliseResults();
  } else {
    G.doneWords = new Map([[G.me.id, mine]]);
    finaliseResults();
  }
}

function showWaitingForResults() {
  const slam = el('div', 'slam', "TIME!");
  const st = el('div'); st.id = 'rstage'; st.appendChild(slam);
  document.body.appendChild(st);
  setTimeout(() => st.remove(), 1500);
}

/* --------------------------- host: scoring -------------------------- */
function finaliseResults() {
  if (G.mode === 'guest') return;
  clearTimeout(G.doneTimer);
  const R = G.round;
  if (!R || G.results) return;

  // Re-verify every submission against the board so a tampered client
  // can't inject words it never actually found.
  const clean = new Map();
  G.doneWords.forEach((list, id) => {
    const ok = [];
    (list || []).forEach(w => {
      if (typeof w !== 'string') return;
      w = w.toUpperCase();
      if (w.length < R.minLen || ok.indexOf(w) >= 0) return;
      if (!Lex.isWord(w)) return;
      if (!findPath(R.board, R.size, w)) return;
      ok.push(w);
    });
    clean.set(id, ok);
  });

  const seenBy = new Map();
  clean.forEach((list, id) => list.forEach(w => {
    if (!seenBy.has(w)) seenBy.set(w, []);
    seenBy.get(w).push(id);
  }));

  const multi = clean.size > 1;
  const players = [];
  let best = null;

  roster().forEach(p => {
    const list = clean.get(p.id) || [];
    const words = list.map(w => {
      const uniq = multi && seenBy.get(w).length === 1;
      const base = wordPoints(w.length);
      const pts = base * (uniq ? UNIQUE_MULT : 1);
      if (!best || pts > best.pts || (pts === best.pts && w.length > best.w.length)) best = { w, pts, id: p.id, uniq };
      return { w, p: pts, u: uniq ? 1 : 0 };
    }).sort((a, b) => b.p - a.p || a.w.localeCompare(b.w));
    players.push({
      id: p.id, name: p.name, color: p.color,
      score: words.reduce((s, x) => s + x.p, 0),
      words, spect: !clean.has(p.id),
    });
  });

  const payload = {
    t: 'results', rid: R.rid, players, best, multi,
    total: G.hostBoardWords ? G.hostBoardWords.length : R.total,
    board: R.board, size: R.size, minLen: R.minLen,
  };
  if (G.mode === 'host') Net.broadcast(payload);
  applyResults(payload);
}

function applyResults(p) {
  G.results = p;
  Results.play(p);
}

/* ===================================================================
   PROTOCOL
   =================================================================== */
function handleMessage(from, m) {
  if (!m || typeof m !== 'object') return;

  /* ---------------- messages a HOST receives from guests -------------- */
  if (G.mode === 'host') {
    switch (m.t) {
      case 'hello': {
        const name = String(m.name || 'Player').slice(0, 14).trim() || 'Player';
        const used = roster().map(p => p.color);
        const color = COLORS.includes(m.color) && !used.includes(m.color)
          ? m.color : (COLORS.find(c => !used.includes(c)) || pick(COLORS));
        G.players.set(from, { id: from, name, color, host: false, found: 0 });
        Sound.join();
        toast(name + ' joined', 'good');

        const live = G.round && !G.round.ended;
        Net.sendTo(from, {
          t: 'welcome', you: from, players: rosterWire(), settings: G.settings, color,
          live: live ? {
            rid: G.round.rid, board: G.round.board, size: G.round.size,
            minLen: G.round.minLen, dur: G.round.dur, total: G.round.total,
            remain: Math.max(0, G.round.endAt - performance.now()),
          } : null,
        });
        Net.broadcast({ t: 'lobby', players: rosterWire(), settings: G.settings }, from);
        if (G.screen === 'lobby') renderLobby();
        if (G.screen === 'game') renderPips();
        break;
      }
      case 'act': {
        const p = G.players.get(from);
        if (p) { p.found = m.n | 0; renderPips(from); }
        Net.broadcast({ t: 'act', id: from, n: m.n | 0 }, from);
        break;
      }
      case 'done': {
        if (!G.round || m.rid !== G.round.rid) break;
        G.doneWords = G.doneWords || new Map();
        G.doneWords.set(from, Array.isArray(m.words) ? m.words.slice(0, 400) : []);
        if (G.pendingDone) {
          G.pendingDone.delete(from);
          if (!G.pendingDone.size) finaliseResults();
        }
        break;
      }
      case 'hb': break;
    }
    return;
  }

  /* --------------- messages a GUEST receives from the host ------------ */
  switch (m.t) {
    case 'welcome':
      G.me.id = m.you;
      if (m.color) G.me.color = m.color;
      setPlayersFrom(m.players);
      G.settings = m.settings || G.settings;
      if (m.live) { beginRound(m.live, true); }
      else { show('lobby'); renderLobby(); }
      break;
    case 'lobby': {
      const before = G.players.size;
      setPlayersFrom(m.players);
      G.settings = m.settings || G.settings;
      if (G.players.size > before) Sound.join(); else if (G.players.size < before) Sound.part();
      if (G.screen === 'lobby') renderLobby();
      if (G.screen === 'game') renderPips();
      break;
    }
    case 'start':
      G.results = null;
      beginRound(m, false);
      break;
    case 'act': {
      const p = G.players.get(m.id);
      if (p) { p.found = m.n | 0; renderPips(m.id); }
      break;
    }
    case 'results':
      if (G.round && !G.round.ended) { G.round.ended = true; cancelAnimationFrame(timerRaf); Board.lock(true); }
      setPlayersFrom(m.players.map(p => ({ id: p.id, name: p.name, color: p.color, host: false })));
      applyResults(m);
      break;
    case 'kick':
      leaveRoom("The host removed you from the lobby.");
      break;
    case 'full':
      break;
    case 'hb': break;
  }
}

/* --------------------------- pips (live) ---------------------------- */
function renderPips(flashId) {
  const box = $('#gpips');
  const others = roster().filter(p => p.id !== G.me.id);
  if (!others.length) { box.innerHTML = ''; return; }
  if (box.children.length !== others.length) {
    box.innerHTML = '';
    others.forEach(p => {
      const w = el('div', 'pip'); w.dataset.id = p.id;
      const d = el('i', 'dot'); d.style.setProperty('--c', p.color);
      w.appendChild(d); w.appendChild(el('span', 'ct', String(p.found || 0)));
      box.appendChild(w);
    });
  } else {
    others.forEach(p => {
      const w = $('.pip[data-id="' + CSS.escape(p.id) + '"]', box);
      if (w) $('.ct', w).textContent = p.found || 0;
    });
  }
  if (flashId) {
    const w = $('.pip[data-id="' + CSS.escape(flashId) + '"]', box);
    if (w) { w.classList.remove('flash'); void w.offsetWidth; w.classList.add('flash'); }
  }
}

/* ===================================================================
   WORD SUBMISSION
   =================================================================== */
function submitWord(word, cells) {
  const R = G.round;
  if (!R || R.ended || R.spectate) return 'no';
  if (word.length < R.minLen) { Sound.bad(); return 'short'; }
  if (R.words.has(word)) { Sound.dup(); buzz(14); return 'dup'; }
  if (!Lex.isWord(word)) { Sound.bad(); buzz([12, 40, 12]); return 'bad'; }

  const pts = wordPoints(word.length);
  R.words.set(word, pts);
  R.score += pts;
  Sound.good(word.length); buzz(word.length >= 6 ? [10, 24, 16] : 12);

  const sn = $('#scoreNum'), holder = $('#gscore');
  odometer(sn, R.score - pts, R.score, 420);
  holder.classList.remove('bump'); void holder.offsetWidth; holder.classList.add('bump');

  const chip = el('div', 'chip' + (word.length >= 6 ? ' big' : ''), word);
  chip.appendChild(el('b', null, '+' + pts));
  const strip = $('#fchips');
  strip.insertBefore(chip, strip.firstChild);
  strip.scrollLeft = 0;
  $('#foundCt').textContent = R.words.size + (R.total ? ' / ' + R.total : '');

  const r = $('#board').getBoundingClientRect();
  floatText('+' + pts, r.left + r.width / 2, r.top + r.height / 2);
  if (word.length >= 6) FX.burst(r.left + r.width / 2, r.top + r.height / 2, 26, 6.28, -1.57, 8);

  const p = meP(); if (p) p.found = R.words.size;
  if (G.mode === 'guest') Net.toHost({ t: 'act', n: R.words.size });
  else if (G.mode === 'host') Net.broadcast({ t: 'act', id: G.me.id, n: R.words.size });

  return 'ok';
}

/** Live feedback while a path is being drawn. */
function peekWord(word) {
  const R = G.round;
  if (!R || word.length < R.minLen) return '';
  if (R.words.has(word)) return 'dup';
  return Lex.isWord(word) ? 'ok' : '';
}

/* ===================================================================
   ROOM ENTRY / EXIT
   =================================================================== */
function readProfile() {
  const n = $('#nameIn').value.trim().slice(0, 14);
  G.me.name = n || 'Player';
  store.set('name', G.me.name);
  store.set('color', G.me.color);
  Sound.init();
}

function startSolo() {
  readProfile();
  G.mode = 'solo';
  G.me.id = 'me';
  G.players.clear();
  G.players.set('me', { id: 'me', name: G.me.name, color: G.me.color, host: true, found: 0 });
  show('lobby'); renderLobby();
}

async function createRoom() {
  readProfile();
  const btn = $('#btnHost'); btn.disabled = true; btn.textContent = 'Opening lobby…';
  try {
    const code = await Net.host();
    G.mode = 'host';
    G.me.id = Net.me;
    G.players.clear();
    G.players.set(Net.me, { id: Net.me, name: G.me.name, color: G.me.color, host: true, found: 0 });
    history.replaceState(null, '', location.pathname + '?r=' + code);
    show('lobby'); renderLobby();
    toast('Lobby ' + code + ' is live', 'good');
  } catch (e) {
    modal('Could not open a lobby', (e && e.message) || 'The peer-to-peer service is unreachable. Check your connection and try again.', [{ label: 'OK', cls: 'grape' }]);
  } finally { btn.disabled = false; btn.innerHTML = '✨ Create a lobby'; }
}

async function joinRoom(code) {
  readProfile();
  code = (code || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (code.length !== 4) { toast('Enter the 4-character code', 'bad'); return; }
  const btn = $('#btnJoin'); btn.disabled = true; btn.textContent = '…';
  try {
    await Net.join(code);
    G.mode = 'guest';
    G.players.clear();
    Net.toHost({ t: 'hello', name: G.me.name, color: G.me.color });
    history.replaceState(null, '', location.pathname + '?r=' + code);
    $('#lobbyState').textContent = 'Connected';
    show('lobby'); renderLobby();
  } catch (e) {
    modal("Couldn't join", (e && e.message) || 'Something went wrong.', [{ label: 'OK', cls: 'grape' }]);
  } finally { btn.disabled = false; btn.textContent = 'Join'; }
}

function leaveRoom(why) {
  Net.destroy();
  cancelAnimationFrame(timerRaf);
  G.mode = 'solo'; G.round = null; G.results = null;
  G.players.clear();
  Results.stop();
  FX.clear();
  history.replaceState(null, '', location.pathname);
  show('home');
  if (why) modal('Disconnected', why, [{ label: 'Back to menu', cls: 'grape' }]);
}

/* ==== 40_board.js ==== */
/* =====================================================================
   BOARD — rendering + input (swipe, tap-to-spell, keyboard)
   ===================================================================== */

const Board = (() => {
  const root = $('#board'), svg = $('#trail'), bubble = $('#bubble');
  const bWord = $('#bubbleW'), bPts = $('#bubbleP');

  let board = [], size = 0, tiles = [], centers = [], adj = [];
  let cell = 0, boxSize = 0;
  let path = [];              // cell indices
  let dragging = false, sticky = false, locked = true;
  let ptrId = null, lastPt = null, movedFar = false, downAt = 0, downCell = -1;
  let typed = '';
  let line = null, headDot = null;

  const UNDERLINE = { M: 1, W: 1, N: 1, Z: 1 };

  /* ------------------------------ layout ------------------------------ */
  function layout() {
    if (!size) return;
    const wrap = $('#boardwrap');
    const w = wrap.clientWidth, h = wrap.clientHeight;
    if (!w || !h) return;
    // Leave room above the board for the floating word bubble.
    boxSize = Math.floor(Math.min(w, h - 54, 620));
    const gap = Math.max(4, Math.round(boxSize * (size >= 6 ? .015 : size === 5 ? .019 : .023)));
    cell = (boxSize - gap * (size + 1)) / size;

    root.style.setProperty('--bs', boxSize + 'px');
    root.style.setProperty('--gap', gap + 'px');
    root.style.setProperty('--tr', Math.round(cell * .21) + 'px');
    root.style.setProperty('--tf', Math.round(cell * .46) + 'px');
    root.style.setProperty('--td', Math.max(3, Math.round(cell * .075)) + 'px');
    root.style.gridTemplateColumns = 'repeat(' + size + ',1fr)';

    centers = [];
    for (let i = 0; i < size * size; i++) {
      const r = (i / size) | 0, c = i % size;
      centers.push({ x: gap + c * (cell + gap) + cell / 2, y: gap + r * (cell + gap) + cell / 2 });
    }
    svg.setAttribute('viewBox', '0 0 ' + boxSize + ' ' + boxSize);
    if (line) line.setAttribute('stroke-width', Math.max(6, cell * .17));
    if (headDot) headDot.setAttribute('r', Math.max(4, cell * .1));
    draw();
  }
  addEventListener('resize', layout);
  addEventListener('orientationchange', () => setTimeout(layout, 250));

  /* ------------------------------ mount ------------------------------- */
  function mount(b, s) {
    board = b.slice(); size = s; adj = adjacency(s);
    path = []; typed = ''; dragging = sticky = false; ptrId = null;

    root.querySelectorAll('.tile').forEach(t => t.remove());
    tiles = [];
    svg.innerHTML = '';
    line = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
    headDot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    headDot.setAttribute('fill', 'rgba(255,255,255,.85)');
    headDot.setAttribute('opacity', '0');
    svg.appendChild(line); svg.appendChild(headDot);

    const stagger = Math.min(26, 420 / (size * size));
    board.forEach((face, i) => {
      const t = el('div', 'tile deal' + (UNDERLINE[face] ? ' rot' : ''));
      const sp = el('span');
      if (face === 'QU') { sp.innerHTML = 'Q<span class="qu">u</span>'; }
      else sp.textContent = face;
      t.appendChild(sp);
      t.style.animationDelay = (i % size + ((i / size) | 0)) * stagger + 'ms';
      root.appendChild(t);
      tiles.push(t);
    });
    layout();
    setTimeout(() => tiles.forEach(t => t.classList.remove('deal')), 1200);
  }

  const lock = v => { locked = v; root.classList.toggle('locked', v); if (v) reset(); };

  /* ---------------------------- path helpers --------------------------- */
  const wordOf = () => path.map(i => board[i]).join('');

  function reset() {
    path = []; typed = '';
    dragging = false; sticky = false; ptrId = null; lastPt = null;
    tiles.forEach(t => t.classList.remove('sel', 'head'));
    root.classList.remove('ok', 'dup');
    bubble.classList.remove('on', 'ok', 'dup');
    draw();
  }

  function draw(livePt) {
    if (!line) return;
    if (!path.length) { line.setAttribute('points', ''); headDot.setAttribute('opacity', '0'); return; }
    const pts = path.map(i => centers[i].x + ',' + centers[i].y);
    if (livePt) pts.push(livePt.x + ',' + livePt.y);
    line.setAttribute('points', pts.join(' '));
    const h = livePt || centers[path[path.length - 1]];
    headDot.setAttribute('cx', h.x); headDot.setAttribute('cy', h.y);
    headDot.setAttribute('opacity', livePt ? '.9' : '0');
  }

  function refresh() {
    tiles.forEach((t, i) => {
      const on = path.indexOf(i) >= 0;
      t.classList.toggle('sel', on);
      t.classList.toggle('head', on && path[path.length - 1] === i);
    });
    const w = wordOf();
    const state = peekWord(w);
    root.classList.toggle('ok', state === 'ok');
    root.classList.toggle('dup', state === 'dup');
    if (path.length) {
      bubble.classList.add('on');
      bubble.classList.toggle('ok', state === 'ok');
      bubble.classList.toggle('dup', state === 'dup');
      bWord.textContent = w;
      bPts.textContent = state === 'ok' ? '+' + wordPoints(w.length)
        : state === 'dup' ? 'found' : w.length + (sticky && path.length > 1 ? ' · tap ✓' : '');
    } else {
      bubble.classList.remove('on', 'ok', 'dup');
    }
    draw(lastPt && dragging ? lastPt : null);
  }

  function pushCell(i) {
    if (path.length && path[path.length - 1] === i) return false;
    if (path.length >= 2 && path[path.length - 2] === i) {       // drag back to undo
      const gone = path.pop();
      tiles[gone].classList.remove('sel', 'head');
      Sound.back(); buzz(5);
      refresh();
      return true;
    }
    if (path.indexOf(i) >= 0) return false;
    if (path.length && adj[path[path.length - 1]].indexOf(i) < 0) return false;
    path.push(i);
    Sound.tick(path.length); buzz(path.length > 6 ? 9 : 6);
    refresh();
    return true;
  }

  /* --------------------------- hit testing ----------------------------- */
  function localPt(ev) {
    const r = root.getBoundingClientRect();
    return { x: ev.clientX - r.left, y: ev.clientY - r.top };
  }
  function cellAt(p) {
    const rad = cell * .46;
    let best = -1, bd = rad * rad;
    for (let i = 0; i < centers.length; i++) {
      const dx = p.x - centers[i].x, dy = p.y - centers[i].y, d = dx * dx + dy * dy;
      if (d < bd) { bd = d; best = i; }
    }
    return best;
  }
  /** Walk the segment between two samples so fast flicks never skip a tile. */
  function sweep(from, to) {
    const dx = to.x - from.x, dy = to.y - from.y;
    const dist = Math.hypot(dx, dy);
    const steps = Math.max(1, Math.ceil(dist / (cell * .3)));
    for (let s = 1; s <= steps; s++) {
      const p = { x: from.x + dx * s / steps, y: from.y + dy * s / steps };
      const i = cellAt(p);
      if (i >= 0) pushCell(i);
    }
  }

  /* ------------------------------ submit ------------------------------- */
  function commit() {
    const w = wordOf(), cells = path.slice();
    if (!cells.length) { reset(); return; }
    const res = submitWord(w, cells);

    if (res === 'ok') {
      cells.forEach((i, k) => setTimeout(() => {
        const t = tiles[i];
        t.classList.remove('pop'); void t.offsetWidth; t.classList.add('pop');
      }, k * 32));
      line.style.transition = 'opacity .4s'; line.style.opacity = '0';
    } else if (res !== 'no') {
      cells.forEach(i => { const t = tiles[i]; t.classList.remove('bad'); void t.offsetWidth; t.classList.add('bad'); });
      if (res === 'short') toast('Need ' + G.round.minLen + '+ letters', null, 1100);
    }
    setTimeout(() => { line.style.transition = ''; line.style.opacity = ''; }, 420);
    reset();
  }

  /* ------------------------------ pointer ------------------------------ */
  root.addEventListener('pointerdown', ev => {
    if (locked) return;
    Sound.init();
    ev.preventDefault();
    const p = localPt(ev), i = cellAt(p);

    if (sticky) {
      if (i < 0) { reset(); return; }
      if (path.length > 1 && i === path[path.length - 1]) { commit(); return; }   // tap the head to submit
      if (path.length && path[path.length - 2] === i) { pushCell(i); return; }    // tap back to undo
      if (path.length && adj[path[path.length - 1]].indexOf(i) < 0 && path.indexOf(i) < 0) {
        reset(); sticky = true;                                                    // restart elsewhere
      }
      if (!pushCell(i) && path.length === 0) pushCell(i);
      downAt = performance.now(); downCell = i; movedFar = false;
      return;
    }

    if (i < 0) return;
    try { root.setPointerCapture(ev.pointerId); } catch (e) { }
    ptrId = ev.pointerId; dragging = true; movedFar = false;
    downAt = performance.now(); downCell = i;
    lastPt = p;
    path = [];
    pushCell(i);
  });

  root.addEventListener('pointermove', ev => {
    if (locked || !dragging || ev.pointerId !== ptrId) return;
    ev.preventDefault();
    const p = localPt(ev);
    if (lastPt && Math.hypot(p.x - lastPt.x, p.y - lastPt.y) > cell * .35) movedFar = true;
    sweep(lastPt || p, p);
    lastPt = p;
    draw(p);
  });

  function up(ev) {
    if (!dragging || (ptrId !== null && ev.pointerId !== ptrId)) return;
    try { root.releasePointerCapture(ptrId); } catch (e) { }
    dragging = false; ptrId = null;
    const quick = performance.now() - downAt < 400;
    if (path.length === 1 && !movedFar && quick) {
      sticky = true;                 // a tap: hold the path and let them spell by tapping
      lastPt = null;
      refresh();
      return;
    }
    lastPt = null;
    commit();
  }
  root.addEventListener('pointerup', up);
  root.addEventListener('pointercancel', () => { if (dragging) { dragging = false; ptrId = null; reset(); } });

  // Desktop nicety: once a path is "stuck", the cursor draws it without holding.
  document.addEventListener('pointermove', ev => {
    if (locked || !sticky || dragging || ev.pointerType !== 'mouse' || !path.length) return;
    const r = root.getBoundingClientRect();
    if (ev.clientX < r.left || ev.clientX > r.right || ev.clientY < r.top || ev.clientY > r.bottom) return;
    const p = { x: ev.clientX - r.left, y: ev.clientY - r.top };
    const i = cellAt(p);
    if (i >= 0) pushCell(i);
  });

  /* ------------------------------ keyboard ------------------------------ */
  addEventListener('keydown', ev => {
    if (locked || G.screen !== 'game') return;
    if (ev.target && /^(INPUT|TEXTAREA)$/.test(ev.target.tagName)) return;

    if (ev.key === 'Enter' || ev.key === ' ') {
      if (path.length) { ev.preventDefault(); commit(); }
      return;
    }
    if (ev.key === 'Escape') { reset(); return; }
    if (ev.key === 'Backspace') {
      ev.preventDefault();
      if (!typed.length) return;
      typed = typed.slice(0, board[path[path.length - 1]] === 'QU' ? -2 : -1);
      const np = typed ? findPath(board, size, typed) : [];
      path = np || []; sticky = !!path.length;
      Sound.back();
      refresh();
      return;
    }
    if (!/^[a-zA-Z]$/.test(ev.key)) return;
    ev.preventDefault();
    Sound.init();
    const c = ev.key.toUpperCase();

    // "Qu" is one tile, so typing Q should consume it and typing the
    // following U should be a no-op.
    if (c === 'U' && typed.endsWith('QU') && findPath(board, size, typed)) return;
    let next = typed + c, np = findPath(board, size, next);
    if (!np && c === 'Q') { next = typed + 'QU'; np = findPath(board, size, next); }
    if (!np) {
      path.forEach(i => { const t = tiles[i]; t.classList.remove('bad'); void t.offsetWidth; t.classList.add('bad'); });
      Sound.bad();
      return;
    }
    typed = next; path = np; sticky = true;
    Sound.tick(path.length);
    refresh();
  });

  return {
    mount, lock, layout,
    cancel: reset,
    get size() { return size; },
    get board() { return board; },
  };
})();

/* ==== 50_results.js ==== */
/* =====================================================================
   RESULTS — the post-round show
   Words rain in one by one, scores tick up, rows physically overtake
   each other (FLIP), then the best word and the winner land.
   ===================================================================== */

const Results = (() => {
  let seq = 0, skipped = false, resolvers = [], data = null, tab = 'rank';
  let live = new Map();       // id -> {row, scoreEl, fillEl, score}
  let allWords = null;

  /* --------------------------- skippable waits ------------------------- */
  function wait(ms) {
    return new Promise(res => {
      if (skipped) return res();
      const t = setTimeout(() => { resolvers = resolvers.filter(r => r.t !== t); res(); }, ms);
      resolvers.push({ t, res });
    });
  }
  function flushWaits() {
    const r = resolvers; resolvers = [];
    r.forEach(x => { clearTimeout(x.t); x.res(); });
  }
  function skip() { skipped = true; flushWaits(); }

  function stop() {
    seq++; skipped = true; flushWaits();
    const w = $('#rwin'); if (w) w.remove();
    const s = $('#rstage'); if (s) s.remove();
    FX.clear();
  }

  /* ------------------------------- FLIP -------------------------------- */
  function flip(container, mutate) {
    const kids = Array.from(container.children);
    const before = new Map();
    kids.forEach(k => before.set(k, k.getBoundingClientRect().top));
    mutate();
    Array.from(container.children).forEach(k => {
      const b = before.get(k); if (b == null) return;
      const d = b - k.getBoundingClientRect().top;
      if (!d) return;
      k.style.transition = 'none';
      k.style.transform = 'translateY(' + d + 'px)';
      requestAnimationFrame(() => {
        k.style.transition = 'transform .45s cubic-bezier(.22,1,.36,1)';
        k.style.transform = '';
      });
    });
  }

  /* ------------------------------ rows --------------------------------- */
  const medal = i => ['🥇', '🥈', '🥉'][i] || (i + 1);

  function buildRows() {
    const box = $('#rrows');
    box.innerHTML = '';
    live = new Map();
    data.players.forEach(p => {
      const row = el('div', 'rrow' + (p.id === G.me.id ? ' mine' : ''));
      row.dataset.id = p.id;
      row.style.setProperty('--c', p.color);
      const fill = el('i', 'fill');
      const rk = el('div', 'rk', '–');
      const info = el('div', 'info');
      info.appendChild(el('div', 'nm', p.name));
      const sub = el('div', 'sub', p.spect ? 'spectating' : '0 words');
      info.appendChild(sub);
      const stream = el('div', 'wstream');
      const sc = el('div', 'sc mono', '0');
      row.append(fill, rk, avatar(p, 38), info, stream, sc);
      box.appendChild(row);
      live.set(p.id, { row, sc, sub, fill, rk, stream, score: 0, shown: 0, p });
    });
  }

  function popWord(id, w, pts, uniq) {
    const L = live.get(id); if (!L) return;
    const n = el('div', 'wpop' + (uniq ? ' uniq' : ''), w + '  +' + pts.toLocaleString());
    L.stream.appendChild(n);
    setTimeout(() => n.remove(), 1050);
  }

  function reorder() {
    const box = $('#rrows');
    flip(box, () => {
      const rows = Array.from(box.children).sort((a, b) => {
        const A = live.get(a.dataset.id), B = live.get(b.dataset.id);
        if (A.p.spect !== B.p.spect) return A.p.spect ? 1 : -1;
        return B.score - A.score || A.p.name.localeCompare(B.p.name);
      });
      rows.forEach(r => box.appendChild(r));
    });
  }

  function paintRanks() {
    const box = $('#rrows');
    let rank = 0, prev = null;
    Array.from(box.children).forEach((r, i) => {
      const L = live.get(r.dataset.id);
      if (L.p.spect) { L.rk.textContent = '·'; r.classList.remove('p1'); return; }
      if (L.score !== prev) { rank = i; prev = L.score; }
      L.rk.textContent = medal(rank);
      r.classList.toggle('p1', rank === 0 && L.score > 0);
    });
  }

  /* ------------------------------ tally -------------------------------- */
  async function tally(token) {
    // Reveal cheapest words first so the lead can flip dramatically at the end.
    const queues = new Map();
    let steps = 0, maxScore = 1;
    data.players.forEach(p => {
      const q = p.words.slice().sort((a, b) => a.p - b.p);
      queues.set(p.id, q);
      steps = Math.max(steps, q.length);
      maxScore = Math.max(maxScore, p.score);
    });
    if (!steps) return;

    const gap = clamp(4200 / steps, 42, 300);
    let lastSound = 0, lastSort = 0;

    for (let k = 0; k < steps; k++) {
      if (token !== seq) return;
      if (skipped) break;
      let any = false;
      data.players.forEach(p => {
        const q = queues.get(p.id);
        if (k >= q.length) return;
        any = true;
        const e = q[k], L = live.get(p.id);
        const from = L.score;
        L.score += e.p; L.shown++;
        odometer(L.sc, from, L.score, Math.min(420, gap * 3));
        L.fill.style.width = (100 * L.score / maxScore) + '%';
        L.sub.textContent = L.shown + (L.shown === 1 ? ' word' : ' words');
        popWord(p.id, e.w, e.p, e.u);
        L.row.classList.remove('tick'); void L.row.offsetWidth; L.row.classList.add('tick');
        const now = performance.now();
        if (now - lastSound > 70) { lastSound = now; e.u ? Sound.coin() : Sound.pop(Math.min(9, e.w.length - 2)); }
      });
      if (!any) continue;
      const now = performance.now();
      if (now - lastSort > 260) { lastSort = now; reorder(); paintRanks(); }
      await wait(gap);
    }

    // Land on the true totals whether we animated or were skipped.
    data.players.forEach(p => {
      const L = live.get(p.id);
      L.score = p.score;
      L.sc.textContent = p.score.toLocaleString();
      L.fill.style.width = (100 * p.score / Math.max(1, maxScore)) + '%';
      const uq = p.words.filter(w => w.u).length;
      L.sub.textContent = p.spect ? 'spectating'
        : p.words.length + (p.words.length === 1 ? ' word' : ' words') + (uq ? ' · ' + uq + ' unique' : '');
    });
    reorder(); paintRanks();
  }

  /* ---------------------------- best word ------------------------------ */
  function showBest() {
    const b = data.best;
    const box = $('#rbest');
    if (!b || !b.w) { box.classList.add('hide'); return; }
    const who = data.players.find(p => p.id === b.id);
    box.innerHTML = '';
    const left = el('div');
    left.appendChild(el('div', 'k', b.uniq ? 'Best word · unique ×2' : 'Best word'));
    left.appendChild(el('div', 'w', b.w));
    left.appendChild(el('div', 'who', 'found by ' + (who ? who.name : '?')));
    box.appendChild(left);
    box.appendChild(el('div', 'p', '+' + b.pts.toLocaleString()));
    box.classList.remove('hide');
    box.style.animation = 'none'; void box.offsetWidth; box.style.animation = '';
    Sound.coin();
    const r = box.getBoundingClientRect();
    FX.burst(r.left + r.width / 2, r.top + r.height / 2, 30, 3.4, -1.57, 9);
  }

  /* ---------------------------- winner splash --------------------------- */
  async function winner(token) {
    const scored = data.players.filter(p => !p.spect).sort((a, b) => b.score - a.score);
    if (!scored.length) return;
    const top = scored[0];
    const tie = scored.filter(p => p.score === top.score && p.score > 0);
    const solo = scored.length === 1;

    const ov = el('div'); ov.id = 'rwin';
    const box = el('div', 'box');
    if (solo) {
      box.appendChild(avatar(top, 112));
      box.appendChild(el('div', 'k', 'Round complete'));
      box.appendChild(el('div', 'nm', top.score.toLocaleString()));
      box.appendChild(el('div', 'sc', top.words.length + ' of ' + data.total + ' words'));
    } else if (tie.length > 1) {
      box.appendChild(el('div', 'k', 'It\'s a tie!'));
      const row = el('div', 'row'); row.style.justifyContent = 'center';
      tie.forEach(p => row.appendChild(avatar(p, 84)));
      box.appendChild(row);
      box.appendChild(el('div', 'nm', tie.map(p => p.name).join(' & ')));
      box.appendChild(el('div', 'sc', top.score.toLocaleString() + ' points'));
    } else {
      box.appendChild(avatar(top, 112, 'crown'));
      box.appendChild(el('div', 'nm', top.name));
      box.appendChild(el('div', 'k', top.id === G.me.id ? 'You win!' : 'Winner'));
      box.appendChild(el('div', 'sc', top.score.toLocaleString() + ' points'));
    }
    ov.appendChild(box);
    document.body.appendChild(ov);

    Sound.fanfare();
    buzz([18, 60, 18, 60, 30]);
    FX.rain(150);
    const w = innerWidth, h = innerHeight;
    FX.burst(w * .18, h * .62, 40, 2.2, -1.2, 15);
    FX.burst(w * .82, h * .62, 40, 2.2, -1.9, 15);

    await wait(2500);
    if (token !== seq) { ov.remove(); return; }
    ov.style.transition = 'opacity .45s'; ov.style.opacity = '0';
    setTimeout(() => ov.remove(), 500);
  }

  /* ------------------------------- tabs -------------------------------- */
  function renderTab() {
    const box = $('#rrows');
    $$('#rtabs button').forEach(b => b.classList.toggle('sel', b.dataset.t === tab));

    if (tab === 'rank') { box.innerHTML = ''; live.forEach(L => box.appendChild(L.row)); reorder(); paintRanks(); return; }

    box.innerHTML = '';
    if (tab === 'words') {
      const ordered = data.players.slice().sort((a, b) => b.score - a.score);
      ordered.forEach(p => {
        const sec = el('div', 'wsec');
        const lbl = el('div', 'lbl');
        lbl.appendChild(avatar(p, 24));
        lbl.appendChild(el('span', null, p.name + ' · ' + p.score.toLocaleString()));
        sec.appendChild(lbl);
        if (!p.words.length) { sec.appendChild(el('div', 'muted', p.spect ? 'Sat this one out' : 'No words this round')); }
        else {
          const g = el('div', 'wgrid');
          p.words.forEach((w, i) => {
            const n = el('div', 'w' + (w.u ? ' uniq' : ''), w.w);
            n.appendChild(el('b', null, '+' + w.p.toLocaleString()));
            n.style.animationDelay = Math.min(i * 12, 500) + 'ms';
            g.appendChild(n);
          });
          sec.appendChild(g);
        }
        box.appendChild(sec);
      });
      return;
    }

    /* every word the board contained */
    const sec = el('div', 'wsec');
    box.appendChild(sec);
    if (!allWords) {
      const load = el('div', 'row'); load.style.cssText = 'gap:12px;padding:20px 4px';
      load.appendChild(el('div', 'spinner'));
      load.appendChild(el('div', 'muted', 'Searching the board…'));
      sec.appendChild(load);
      setTimeout(() => {
        allWords = solveBoard(data.board, data.size, data.minLen).sort((a, b) => b.length - a.length || a.localeCompare(b));
        if (tab === 'all') renderTab();
      }, 30);
      return;
    }
    const got = new Set();
    data.players.forEach(p => p.words.forEach(w => got.add(w.w)));
    const mineSet = new Set((data.players.find(p => p.id === G.me.id) || { words: [] }).words.map(w => w.w));

    const lbl = el('div', 'lbl');
    lbl.textContent = allWords.length.toLocaleString() + ' words were on this board · you found ' + mineSet.size;
    sec.appendChild(lbl);

    const CAP = 600;
    const list = allWords.slice(0, CAP);
    const g = el('div', 'wgrid');
    list.forEach((w, i) => {
      const found = got.has(w);
      const n = el('div', 'w' + (mineSet.has(w) ? ' uniq' : found ? '' : ' miss'), w);
      if (found) n.appendChild(el('b', null, '+' + wordPoints(w.length).toLocaleString()));
      n.style.animationDelay = Math.min(i * 4, 400) + 'ms';
      g.appendChild(n);
    });
    sec.appendChild(g);
    if (allWords.length > CAP) sec.appendChild(el('div', 'muted', '…and ' + (allWords.length - CAP).toLocaleString() + ' more'));
  }

  /* ------------------------------- finish ------------------------------- */
  function finish() {
    $('#rtabs').classList.remove('hide');
    $('#btnSkip').classList.add('hide');
    tab = 'rank';
    renderTab();
    const solo = G.mode === 'solo';
    const btn = $('#btnAgain'), msg = $('#againMsg');
    if (canControl()) {
      btn.classList.remove('hide');
      btn.innerHTML = '<span class="shine"></span>' + (solo ? 'New board' : 'Next round');
      msg.textContent = solo ? '' : 'Everyone stays in the lobby between rounds.';
    } else {
      btn.classList.remove('hide');
      btn.innerHTML = 'Back to lobby';
      msg.textContent = 'The host can start the next round whenever.';
    }
  }

  /* -------------------------------- play -------------------------------- */
  async function play(p) {
    const token = ++seq;
    skipped = false; resolvers = []; allWords = null; data = p;

    show('results');
    $('#rbest').classList.add('hide');
    $('#rtabs').classList.add('hide');
    $('#btnSkip').classList.remove('hide');
    $('#btnAgain').classList.add('hide');
    $('#againMsg').textContent = '';
    const mine = p.players.find(x => x.id === G.me.id);
    $('#rsub').textContent = p.size + '×' + p.size + ' · ' + p.minLen + '+ letters'
      + (mine && !mine.spect ? ' · you found ' + mine.words.length : '');

    buildRows();
    await wait(1150);
    if (token !== seq) return;
    await tally(token);
    if (token !== seq) return;
    showBest();
    await wait(1500);
    if (token !== seq) return;
    await winner(token);
    if (token !== seq) return;
    finish();
  }

  $$('#rtabs button').forEach(b => b.onclick = () => { tab = b.dataset.t; Sound.tick(4); renderTab(); });
  $('#btnSkip').onclick = () => { skip(); Sound.tick(2); };

  return { play, stop, skip };
})();

};

/* --------------------------- net plumbing ---------------------------- */
Net.handlers.msg = handleMessage;

Net.handlers.peerClose = id => {
  const p = G.players.get(id);
  if (!p) return;
  G.players.delete(id);
  Sound.part();
  toast(p.name + ' left');
  Net.broadcast({ t: 'lobby', players: rosterWire(), settings: G.settings });
  if (G.screen === 'lobby') renderLobby();
  if (G.screen === 'game') renderPips();
  if (G.pendingDone && G.pendingDone.delete(id) && !G.pendingDone.size) finaliseResults();
};

Net.handlers.hostGone = () => leaveRoom('The host closed the lobby or lost connection.');

Net.handlers.netError = e => {
  console.warn('net', e);
  toast('Connection hiccup', 'bad');
};

Net.handlers.statusChange = s => {
  const n = $('#lobbyState');
  if (!n) return;
  n.textContent = s === 'reconnecting' ? 'Reconnecting\u2026' : 'Connected';
  n.classList.toggle('live', s !== 'reconnecting');
};

addEventListener('pagehide', () => { try { Net.destroy(); } catch (e) { } });
document.addEventListener('visibilitychange', () => { if (!document.hidden) Sound.init(); });

/* ------------------------------- start ------------------------------- */
(async function boot() {
  const bar = $('#loadbar'), msg = $('#loadmsg');
  try {
    await Lex.load(DICT_B64, (p, m) => {
      bar.style.width = Math.round(p * 100) + '%';
      if (m) msg.textContent = m;
    });
  } catch (e) {
    msg.textContent = (e && e.message) || 'Could not load the dictionary.';
    return;
  }
  await sleep(220);
  show('home');

  const r = new URLSearchParams(location.search).get('r');
  if (r && /^[A-Z0-9]{4}$/i.test(r)) {
    $('#codeIn').value = r.toUpperCase();
    if (!$('#nameIn').value) { $('#nameIn').focus(); toast('Enter a name, then tap Join'); }
    else toast('Tap Join to enter room ' + r.toUpperCase());
  }
})();

</script>
</body>
</html>
